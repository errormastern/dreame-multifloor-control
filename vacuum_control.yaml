blueprint:
  name: "🤖 Dreame Vacuum – Multi-Floor Control"
  description: |
    **🤖 Dreame Vacuum – Multi-Floor Control**
    *Version: 0.10.1*

    A Home Assistant blueprint for controlling Dreame vacuums across multiple floors.
    Supports scheduled cleaning with automatic preparation and transport notifications for non-base-station maps and manual control via buttons or other triggers. **Never care about the right robot settings for seamless multi-floor cleaning again.**

    **✨ Main Features:**
    🤖 Auto-detection of vacuum entities (select vacuum, rest auto-detected)
    ⚙️ Automatically verify and configure optimal robot settings prior to each cleaning cycle
    📅 Per-map schedules with sweep/mop modes (4 maps, 8 schedules total)
    🔔 Notification workflow with action buttons for transport preparation
    👥 Multi-recipient notifications with presence checking
    ⏭️ Manual control via MQTT, device triggers, state changes, or events
    🏠 Segment-based Map cleaning with configurable repeats
    ✨ Optional customised cleaning using room settings from Dreame app
    💧 Mop readiness check (mop pad + water tank) with sweep-only fallback
    🗺️ Auto-discard temporary maps for seamless multi-floor operation
    🏠 Auto-Switch-Back to Base Map after multi-floor cleaning

    **Requirements:**
    • Home Assistant ≥ 2024.10.0
    • Dreame Vacuum Integration ≥ v2.0.0b21
    • At least one saved map configured
    • Optional: Schedule helpers for time-based automation

    📖 [Full Documentation](https://github.com/errormastern/dreame-multifloor-control)
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/errormastern/dreame-multifloor-control/blob/main/vacuum_control.yaml
  input:
    # ========================================
    # ROBOT CONFIGURATION
    # ========================================
    robot_config:
      name: "Robot Configuration"
      description: "Select your Dreame vacuum and configure transport behavior. Entities are auto-detected."
      icon: mdi:robot-vacuum
      collapsed: true
      input:
        vacuum_entity:
          name: "🤖 Vacuum Entity"
          description: |
            Select your vacuum entity (e.g., `vacuum.xiaomi_x10`).
            All other entities are auto-detected from this selection.
          selector:
            entity:
              filter:
                - domain: vacuum
              multiple: false

        pause_delay_after_undock:
          name: "⏸️ Pause Delay After Start"
          description: |
            Wait time after starting cleaning before pausing for manual transport.
            Allows robot to move away from base station for easier pickup.

            • **0s:** Skip start entirely (robot stays docked)
            • **1-3s:** Short delay (robot slightly away from dock)
            • **4-5s:** Recommended (robot well clear of dock, easy to grab)
            • **6-10s:** Extended delay (robot moves further from base station)

            Only applies to non-base station maps.
          selector:
            number:
              min: 0.0
              max: 10.0
              step: 0.5
              unit_of_measurement: "s"
              mode: slider
          default: 4.5

    # ========================================
    # MAP 1 CONFIGURATION
    # ========================================
    map_1_config:
      name: "Map 1"
      description: "Configure Map 1: trigger, cleaning settings, and schedules. Map name is auto-detected."
      icon: mdi:home-floor-1
      collapsed: true
      input:
        map_1_cleaning_repeats:
          name: "🔄 Cleaning Repeats"
          description: |
            Number of cleaning passes per room/segment (1-3).

            • **1:** Quick daily cleaning
            • **2:** Normal cleaning (recommended)
            • **3:** Deep/intensive cleaning
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: slider
              unit_of_measurement: "passes"
          default: 2

        map1_trigger:
          name: "🔀 Map Switch Trigger (Optional)"
          description: |
            Trigger to switch to this map.

            **MQTT/Device triggers:** Auto-detected
            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_map1`
          selector:
            trigger:
          default: []

        map_1_sweep_schedule:
          name: "📅 Sweep-Only Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep-only cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

        map_1_mop_schedule:
          name: "📅 Sweep+Mop Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep+mop cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

    # ========================================
    # MAP 2 CONFIGURATION
    # ========================================
    map_2_config:
      name: "Map 2"
      description: "Configure Map 2: trigger, cleaning settings, and schedules. Map name is auto-detected."
      icon: mdi:home-floor-2
      collapsed: true
      input:
        map_2_cleaning_repeats:
          name: "🔄 Cleaning Repeats"
          description: |
            Number of cleaning passes per room/segment (1-3).

            • **1:** Quick daily cleaning
            • **2:** Normal cleaning (recommended)
            • **3:** Deep/intensive cleaning
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: slider
              unit_of_measurement: "passes"
          default: 2

        map2_trigger:
          name: "🔀 Map Switch Trigger (Optional)"
          description: |
            Trigger to switch to this map.

            **MQTT/Device triggers:** Auto-detected
            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_map2`
          selector:
            trigger:
          default: []

        map_2_sweep_schedule:
          name: "📅 Sweep-Only Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep-only cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

        map_2_mop_schedule:
          name: "📅 Sweep+Mop Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep+mop cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

    # ========================================
    # MAP 3 CONFIGURATION
    # ========================================
    map_3_config:
      name: "Map 3"
      description: "Configure Map 3: trigger, cleaning settings, and schedules. Map name is auto-detected."
      icon: mdi:home-floor-3
      collapsed: true
      input:
        map_3_cleaning_repeats:
          name: "🔄 Cleaning Repeats"
          description: |
            Number of cleaning passes per room/segment (1-3).

            • **1:** Quick daily cleaning
            • **2:** Normal cleaning (recommended)
            • **3:** Deep/intensive cleaning
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: slider
              unit_of_measurement: "passes"
          default: 2

        map3_trigger:
          name: "🔀 Map Switch Trigger (Optional)"
          description: |
            Trigger to switch to this map.

            **MQTT/Device triggers:** Auto-detected
            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_map3`
          selector:
            trigger:
          default: []

        map_3_sweep_schedule:
          name: "📅 Sweep-Only Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep-only cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

        map_3_mop_schedule:
          name: "📅 Sweep+Mop Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep+mop cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

    # ========================================
    # MAP 4 CONFIGURATION
    # ========================================
    map_4_config:
      name: "Map 4"
      description: "Configure Map 4: trigger, cleaning settings, and schedules. Map name is auto-detected."
      icon: mdi:home-floor-0
      collapsed: true
      input:
        map_4_cleaning_repeats:
          name: "🔄 Cleaning Repeats"
          description: |
            Number of cleaning passes per room/segment (1-3).

            • **1:** Quick daily cleaning
            • **2:** Normal cleaning (recommended)
            • **3:** Deep/intensive cleaning
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: slider
              unit_of_measurement: "passes"
          default: 2

        map4_trigger:
          name: "🔀 Map Switch Trigger (Optional)"
          description: |
            Trigger to switch to this map.

            **MQTT/Device triggers:** Auto-detected
            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_map4`
          selector:
            trigger:
          default: []

        map_4_sweep_schedule:
          name: "📅 Sweep-Only Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep-only cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

        map_4_mop_schedule:
          name: "📅 Sweep+Mop Schedule (Optional)"
          description: |
            Schedule helper for automatic sweep+mop cleaning.

            Create schedule helper first (Settings → Devices & Services → Helpers),
            then select here. Leave as "none" to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: schedule

    # ========================================
    # MAP FUNCTIONS
    # ========================================
    map_functions:
      name: "Map Functions"
      description: "Automatic map switching and temporary map handling."
      icon: mdi:map
      collapsed: true
      input:
        base_station_map_name:
          name: "🏠 Base Station Map"
          description: |
            Name of the map the base station physically stands on — exactly as shown in
            `select.{robot}_selected_map` (e.g. `Wohnzimmer`).

            **Why by name and not by slot:** map slots re-sort when the robot auto-creates
            a new map. The names survive that; the slot numbers do not.

            Leave empty to auto-detect via `charger_position`.
            ⚠️ Auto-detection is unreliable: old maps often keep a stale charger position,
            and the last match wins.
          selector:
            text:
          default: ""

        auto_switch_to_base_map:
          name: "🗺️ Auto-Switch-Back to Base Map"
          description: "Automatically switch back to base station map after room cleaning is completed."
          selector:
            boolean:
          default: true

        task_status_sensor_trigger:
          name: "🔍 Task Status Sensor"
          description: "Select task status sensor (e.g., `sensor.{vacuum_name}_task_status`). Leave empty to disable auto-switch."
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: false
          default: []

        auto_discard_temporary_map:
          name: "🗺️ Auto-Discard Temporary Maps"
          description: |
            Automatically discard temporary maps before switching maps.
            Allows seamless multi-floor operation when robot creates new maps.
          selector:
            boolean:
          default: true

    # ========================================
    # CONTROL FUNCTIONS
    # ========================================
    control_functions:
      name: "Control Functions"
      description: "Configure triggers for mode switching and cleaning control."
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        start_trigger:
          name: "▶️ Smart Start/Pause/Resume Trigger"
          description: |
            Intelligent control based on robot status:
            • Idle → Start cleaning
            • Cleaning → Pause
            • Paused → Resume

            **MQTT/Device triggers:** Auto-detected
            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_start`
          selector:
            trigger:
          default: []

        sweep_trigger:
          name: "🧹 Sweep Only Mode Trigger"
          description: |
            Switches vacuum to sweep-only mode (no mopping).

            **MQTT/Device triggers:** Auto-detected
            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_sweep`
          selector:
            trigger:
          default: []

        mop_trigger:
          name: "💧 Sweep + Mop Mode Trigger"
          description: |
            Switches vacuum to sweep + mop mode (full cleaning).

            **MQTT/Device triggers:** Auto-detected
            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_mop`
          selector:
            trigger:
          default: []

        room_trigger:
          name: "🚪 Single Room Cleaning Trigger (Optional)"
          description: |
            Trigger for cleaning exactly ONE room. The map switch, the mode and the
            whole preparation procedure are handled by the blueprint.

            The trigger only matches `fn`; the target rides along in the same event
            and is read by the automation:

            ```yaml
            trigger: event
            event_type: dreame_room
            event_data:
              fn: room        # matched
            id: fn_room
            ```

            Your script sends, in the SAME event:
            • `map`  — map slot 1-4
            • `room` — room id on THAT map (from the map camera's `rooms` attribute)
            • `mode` — `sweep` or `mop`

            Room ids are only unique within a map, so always send `map` and `room`
            together.

            ⚠️ **State/Event triggers:** Set Trigger ID to `fn_room`
          selector:
            trigger:
          default: []

    # ========================================
    # CLEANING SETTINGS
    # ========================================
    cleaning_settings:
      name: "Cleaning Settings"
      description: "Configure cleaning behavior and segment-based cleaning."
      icon: mdi:tune
      collapsed: true
      input:
        global_cleaning_repeats:
          name: "🔄 Global Cleaning Repeats (Fallback)"
          description: |
            Default cleaning passes per room/segment (1-3).
            Used only when per-map repeats are not configured.

            • **1:** Daily cleaning
            • **2:** Normal cleaning (recommended)
            • **3:** Intensive/deep cleaning

            **Note:** Per-map repeats override this setting.
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: slider
              unit_of_measurement: "passes"
          default: 2

        use_segment_service:
          name: "🧩 Use Segment Service"
          description: |
            Enable room/segment-based cleaning with configurable repeats.
            Uses `dreame_vacuum.vacuum_clean_segment` service.

            **Integration with Customized Cleaning:**
            When customized_cleaning or cleaning_sequence is enabled, segment service call parameters (repeats, suction, water) are ignored by robot. Robot uses settings from Dreame app instead.

            Disable if segments aren't detected or robot doesn't support segment cleaning.
            Falls back to `vacuum.start` when disabled.
          selector:
            boolean:
          default: true

        use_cleaning_sequence:
          name: "📋 Use Cleaning Sequence"
          description: |
            Enable room cleaning sequence from Dreame app settings (uses `order` attribute from map).
            Optional: Cleans rooms in user-defined order from Dreame app.

            **Fallback:** If disabled or no sequence defined, cleans all rooms without specific order.
            **Requires:** Firmware ≥1156, `switch.{robot}_cleaning_sequence` available.
          selector:
            boolean:
          default: true

        use_customized_cleaning:
          name: "⚙️ Use Customized Cleaning (Mop Modes Only)"
          description: |
            Enable room-specific cleaning settings from Dreame app (suction level, water volume, mop humidity, repeats per room).
            Optional: Uses per-room settings defined in Dreame app.

            **IMPORTANT:** Only used for Sweep+Mop programs. Sweep-only programs use sequence but NOT customized settings.
            **Fallback:** If disabled or no room settings defined, uses global mode and blueprint repeat settings.
            **Requires:** Firmware ≥1156, `switch.{robot}_customized_cleaning` available.
          selector:
            boolean:
          default: true

    # ========================================
    # NOTIFICATION SETTINGS
    # ========================================
    notification_settings:
      name: "Notification Settings"
      description: "Configure notifications for scheduled cleaning and pickup events."
      icon: mdi:bell
      collapsed: true
      input:
        # --- SHARED SETTINGS ---
        notification_enabled:
          name: "🔔 Enable Notifications"
          description: |
            Send notifications for scheduled cleaning and pickup events.
            Includes "Prepare Robot" and "Start Cleaning" action buttons.
          selector:
            boolean:
          default: false

        notification_persons:
          name: "👤 Persons to Notify"
          description: |
            Select persons to notify. Only persons at home receive notifications.
            Notification service is auto-detected from person's device tracker.
          selector:
            entity:
              domain: person
              multiple: true
          default: []

        notification_groups:
          name: "👥 Notification Groups"
          description: |
            Notification groups to notify (no presence check).
            Enter group names without 'notify.' prefix.

            Example: `family_phones` → calls `notify.family_phones`
          selector:
            text:
              multiple: true
          default: []

        # --- SCHEDULED CLEANING NOTIFICATIONS ---
        scheduled_notification_title:
          name: "📅 Schedule Notification Title"
          description: |
            Title for scheduled cleaning notifications.

            **Variables:** `robot_name`, `map_name`, `cleaning_mode_display`, `current_time`
          selector:
            text:
          default: "Scheduled Cleaning Ready"

        scheduled_notification_message:
          name: "📅 Schedule Notification Message"
          description: |
            Message for scheduled cleaning notifications.

            **Variables:** `robot_name`, `map_name`, `cleaning_mode_display`, `current_time`, `repeat_number`
          selector:
            text:
              multiline: true
          default: "{{ robot_name }} is ready for scheduled cleaning on {{ map_name }} ({{ cleaning_mode_display }}). Please prepare the robot."

        scheduled_notification_repeat_count:
          name: "📅 Schedule Repeat Count"
          description: "How many times to resend if no response (1-3)."
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: slider
          default: 2

        scheduled_notification_repeat_interval:
          name: "📅 Schedule Repeat Interval"
          description: "Minutes between reminder notifications (0 = no repeats)."
          selector:
            number:
              min: 0
              max: 240
              step: 5
              unit_of_measurement: "min"
              mode: slider
          default: 15

        # --- PICKUP NOTIFICATIONS ---
        pickup_notification_title:
          name: "🤖 Pickup Notification Title"
          description: |
            Title for pickup notifications (robot ready for transport).

            **Variables:** `robot_name`, `map_name`, `cleaning_mode_display`, `current_time`
          selector:
            text:
          default: "Robot Ready for Transport"

        pickup_notification_message:
          name: "🤖 Pickup Notification Message"
          description: |
            Message for pickup notifications.

            **Variables:** `robot_name`, `map_name`, `cleaning_mode_display`, `current_time`, `repeat_number`
          selector:
            text:
              multiline: true
          default: "{{ robot_name }} is paused and ready for transport to {{ map_name }}. Please pick up the robot."

        pickup_notification_repeat_count:
          name: "🤖 Pickup Repeat Count"
          description: "How many times to resend if robot not started (1-3)."
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: slider
          default: 2

        pickup_notification_repeat_interval:
          name: "🤖 Pickup Repeat Interval"
          description: "Minutes between reminder notifications (0 = no repeats)."
          selector:
            number:
              min: 0
              max: 240
              step: 5
              unit_of_measurement: "min"
              mode: slider
          default: 10

        # --- iOS SETTINGS (SHARED) ---
        notification_interruption_level:
          name: "📱 iOS Interruption Level"
          description: |
            Notification priority level for iOS devices.

            • **Passive:** Silent, background only
            • **Active:** Standard, shows on lock screen
            • **Time-Sensitive:** Bypasses Focus modes
            • **Critical:** Always notifies, bypasses Do Not Disturb
          selector:
            select:
              options:
                - label: "Passive (Silent, Background)"
                  value: "passive"
                - label: "Active (Standard, Lock Screen)"
                  value: "active"
                - label: "Time-Sensitive (Bypass Focus)"
                  value: "time-sensitive"
                - label: "Critical (Always Notify)"
                  value: "critical"
          default: "time-sensitive"

        notification_sound:
          name: "🔊 iOS Sound"
          description: "Sound for iOS notifications (`default`, `none`, or custom)."
          selector:
            text:
          default: "default"

        notification_critical:
          name: "🚨 iOS Critical Alert"
          description: "Bypass Do Not Disturb and mute switch. Requires iOS permission."
          selector:
            boolean:
          default: false

        notification_volume:
          name: "🔈 iOS Critical Volume"
          description: "Volume for critical alerts (0.0-1.0)."
          selector:
            number:
              min: 0.0
              max: 1.0
              step: 0.1
              mode: slider
          default: 1.0

    # ========================================
    # LOCALIZATION
    # ========================================
    localization_config:
      name: "Localization"
      description: "Customize display texts for notifications and buttons."
      icon: mdi:translate
      collapsed: true
      input:
        sweep_display_text:
          name: "🧹 Sweep Mode Display Name"
          description: "Display name for sweep-only mode (e.g., 'Saugen' in German)"
          selector:
            text:
          default: "Sweep"

        mop_display_text:
          name: "💧 Mop Mode Display Name"
          description: "Display name for mop-only mode (e.g., 'Wischen' in German)"
          selector:
            text:
          default: "Mop"

        sweep_mop_display_text:
          name: "🧹💧 Sweep + Mop Mode Display Name"
          description: "Display name for combined sweep+mop mode (e.g., 'Saugen + Wischen' in German)"
          selector:
            text:
          default: "Sweep + Mop"

        prepare_button_text:
          name: "✋ Prepare Button Label"
          description: "Button text for robot preparation (e.g., 'Roboter vorbereiten' in German)"
          selector:
            text:
          default: "Prepare Robot"

        skip_button_text:
          name: "⏭️ Skip Button Label"
          description: "Button text for skipping cleaning (e.g., 'Reinigung überspringen' in German)"
          selector:
            text:
          default: "Skip Cleaning"

        start_cleaning_button_text:
          name: "▶️ Start Cleaning Button Label"
          description: "Button text for starting cleaning (e.g., 'Reinigung starten' in German)"
          selector:
            text:
          default: "Start Cleaning"

        cancel_cleaning_button_text:
          name: "❌ Cancel Button Label"
          description: "Button text for canceling (e.g., 'Abbrechen' in German)"
          selector:
            text:
          default: "Cancel Cleaning"

        sweep_only_button_text:
          name: "🧹 Sweep Only Button Label"
          description: "Button text for sweep-only fallback when mop not ready"
          selector:
            text:
          default: "Start Sweep Only"

        mop_not_ready_title:
          name: "⚠️ Mop Not Ready - Title"
          description: "Notification title when mop pads missing or water empty"
          selector:
            text:
          default: "⚠️ Mop Not Ready"

        mop_not_ready_message:
          name: "💬 Mop Not Ready - Message"
          description: "Notification message when mop pads missing or water empty"
          selector:
            text:
              multiline: true
          default: "Mop pads not installed or water tank empty. Start sweep-only instead?"

    # ========================================
    # ADVANCED SETTINGS
    # ========================================
    advanced_settings:
      name: "Advanced Settings"
      description: "Timeouts, mode values, status detection, and debugging. Most users can keep defaults."
      icon: mdi:cog
      collapsed: true
      input:
        # ============================================
        # TIMEOUTS
        # ============================================
        moistening_timeout:
          name: "⏱️ Moistening Timeout"
          description: |
            Wait time for mop washing cycle at base station (typically 3-4 minutes).
            Blueprint waits for washing completion or timeout before starting cleaning.

            Based on testing: ~186s actual washing time, 215s recommended for safe detection.
            Increase if washing takes longer on your model.
          selector:
            number:
              min: 10
              max: 300
              step: 5
              unit_of_measurement: "s"
              mode: slider
          default: 215

        sweep_start_timeout:
          name: "⏱️ Sweep Start Timeout"
          description: |
            Wait time for sweep-only cleaning to start (typically 5-15 seconds).
            Robot undocks immediately without washing cycle when sweeping only.

            Adjust if your robot needs more time to register cleaning start.
          selector:
            number:
              min: 5
              max: 60
              step: 5
              unit_of_measurement: "s"
              mode: slider
          default: 30

        mop_start_timeout:
          name: "⏱️ Mop Start Timeout"
          description: |
            Wait time for mop operations (typically 60-120s). Used for:
            • Washing to START after button press
            • Robot to START cleaning after washing completes

            Increase if your robot needs more time to respond.
          selector:
            number:
              min: 60
              max: 180
              step: 10
              unit_of_measurement: "s"
              mode: slider
          default: 120

        # ============================================
        # MODE VALUES
        # ============================================
        sweeping_mode_value:
          name: "🧹 Mode Value: Sweep Only"
          description: |
            Exact value for sweep-only mode (case-sensitive).

            Check your vacuum's `select.{name}_cleaning_mode` entity in
            Developer Tools → States for available options.
          selector:
            text:
          default: "sweeping"

        sweeping_mopping_mode_value:
          name: "💧 Mode Value: Mop Program"
          description: |
            Which cleaning mode the blueprint SELECTS whenever a mop program is
            requested — the mop trigger, mop schedules, the prepare notification and
            single-room mopping all use this one value.

            • `sweeping_and_mopping` — sweep and mop in one pass (default)
            • `mopping_after_sweeping` — sweep everything first, then mop it
            • `mopping` — mop only

            ⚠️ `mopping_after_sweeping` roughly doubles the runtime, and on a map
            without the base station the robot spends about a minute hunting for a
            dock between the two passes before it continues.

            Must be one of the options of `select.{name}_cleaning_mode`
            (Developer Tools → States).
          selector:
            select:
              custom_value: true
              options:
                - "sweeping_and_mopping"
                - "mopping_after_sweeping"
                - "mopping"
          default: "sweeping_and_mopping"

        # ============================================
        # STATUS DETECTION
        # ============================================
        cleaning_states:
          name: "🔍 Active Cleaning States"
          description: |
            Comma-separated list of status values for active cleaning.
            Used to detect if robot is working (for pause logic).

            Check your vacuum's `sensor.{name}_status` entity for actual values.
            Only change if your robot reports different states.
          selector:
            text:
          default: "cleaning,returning,zone_cleaning,room_cleaning,sweeping,mopping,sweeping_and_mopping"

        moistening_status:
          name: "🔍 Moistening Status"
          description: |
            Status value during mop moistening (e.g., `moistening`, `wetting_mop`).
            Used for sweep+mop: waits for this status before pausing for transport.

            Leave empty if unsure or not applicable to your robot.
          selector:
            text:
          default: ""

        paused_states:
          name: "🔍 Paused States"
          description: |
            Comma-separated status values when robot is paused.
            Used for resume logic in smart start/pause function.

            **Common values:** paused, sleeping, standby
            **Default:** `paused,sleeping,standby`

            Check your `sensor.{name}_status` for actual values.
          selector:
            text:
          default: "paused,sleeping,standby"

        error_states:
          name: "🔍 Error States"
          description: |
            Comma-separated status values indicating robot error conditions.
            Blueprint will show persistent notification with error info.

            **Default:** `error`

            Leave empty to disable error monitoring.
          selector:
            text:
          default: "error"

        idle_states:
          name: "🔍 Idle States"
          description: |
            Comma-separated status values when robot is idle/ready.
            Used for status detection in smart start logic.

            **Common values:** idle, sleeping, standby
            **Default:** `idle,sleeping,standby`
          selector:
            text:
          default: "idle,sleeping,standby"

        base_warning_states:
          name: "🔍 Base Station Warning States"
          description: |
            Comma-separated base station status values requiring attention.
            Shows persistent notification for tank empty, washing paused, etc.

            **Common values:** paused, clean_add_water
            **Default:** `paused,clean_add_water`

            Leave empty to disable base station monitoring.
          selector:
            text:
          default: "paused,clean_add_water"

        # ============================================
        # DEBUG
        # ============================================
        debug_level:
          name: "🐛 Debug Level"
          description: |
            Control debug notification verbosity.

            • **Off:** No debug notifications
            • **Info:** Summary after completion
            • **Debug:** All steps + summary

            Error/Warning notifications always appear regardless of level.
          selector:
            select:
              options:
                - label: "Off"
                  value: "0"
                - label: "Info (Summary only)"
                  value: "1"
                - label: "Debug (All steps)"
                  value: "2"
          default: "0"

# ========================================
# TRIGGER CONFIGURATION
# ========================================
# Function-based trigger merging with conditional enabling
# Each function merges its user-configured triggers
triggers:
  # ========================================
  # FALLBACK TRIGGER (Required for blueprint validation)
  # ========================================
  # This trigger ensures the blueprint always has at least one valid trigger
  # It will never actually fire in normal operation
  # User must configure and enable at least one function for the automation to work
  - trigger: event
    event_type: "dreame_blueprint_setup_required"
    id: "setup_required"

  # ========================================
  # AUTO-SWITCH-BACK TO BASE MAP
  # ========================================
  # Automatically switches back to base station map when robot docks
  # Triggers when vacuum returns to dock from any non-docked state
  - trigger: state
    entity_id: !input vacuum_entity
    to: "docked"
    from:
      - "cleaning"
      - "returning"
      - "paused"
      - "error"
      - "idle"
    id: auto_switch_to_base

  # ========================================
  # FUNCTION 1: Sweep Only Mode
  # ========================================
  - triggers: !input sweep_trigger

  # ========================================
  # FUNCTION 2: Sweep + Mop Mode
  # ========================================
  - triggers: !input mop_trigger

  # ========================================
  # FUNCTION 8: Single Room Cleaning
  # ========================================
  # Carries map/room/mode in the event data - see the room_trigger input.
  - triggers: !input room_trigger

  # ========================================
  # FUNCTION 3: Smart Start/Pause/Resume
  # ========================================
  - triggers: !input start_trigger

  # ========================================
  # FUNCTION 4: Map 1 Switch
  # ========================================
  - triggers: !input map1_trigger

  # ========================================
  # FUNCTION 5: Map 2 Switch
  # ========================================
  - triggers: !input map2_trigger

  # ========================================
  # FUNCTION 6: Map 3 Switch
  # ========================================
  - triggers: !input map3_trigger

  # ========================================
  # FUNCTION 7: Map 4 Switch
  # ========================================
  - triggers: !input map4_trigger

  # ========================================
  # SCHEDULE TRIGGERS (Per-Map Scheduled Cleaning)
  # ========================================
  # Note: If schedule input is empty (default), trigger will never fire
  # Map 1 Schedules
  - trigger: state
    entity_id: !input map_1_sweep_schedule
    to: "on"
    id: schedule_map1_sweep

  - trigger: state
    entity_id: !input map_1_mop_schedule
    to: "on"
    id: schedule_map1_mop

  # Map 2 Schedules
  - trigger: state
    entity_id: !input map_2_sweep_schedule
    to: "on"
    id: schedule_map2_sweep

  - trigger: state
    entity_id: !input map_2_mop_schedule
    to: "on"
    id: schedule_map2_mop

  # Map 3 Schedules
  - trigger: state
    entity_id: !input map_3_sweep_schedule
    to: "on"
    id: schedule_map3_sweep

  - trigger: state
    entity_id: !input map_3_mop_schedule
    to: "on"
    id: schedule_map3_mop

  # Map 4 Schedules
  - trigger: state
    entity_id: !input map_4_sweep_schedule
    to: "on"
    id: schedule_map4_sweep

  - trigger: state
    entity_id: !input map_4_mop_schedule
    to: "on"
    id: schedule_map4_mop

  # ========================================
  # NOTIFICATION ACTION TRIGGERS
  # ========================================
  # Triggered by mobile app notification button clicks
  # These handle user responses to notifications (prepare, skip, start, cancel)

  # Scheduled Cleaning Actions
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP1_SWEEP"
    id: notification_prepare_map1_sweep

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP1_MOP"
    id: notification_prepare_map1_mop

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP2_SWEEP"
    id: notification_prepare_map2_sweep

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP2_MOP"
    id: notification_prepare_map2_mop

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP3_SWEEP"
    id: notification_prepare_map3_sweep

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP3_MOP"
    id: notification_prepare_map3_mop

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP4_SWEEP"
    id: notification_prepare_map4_sweep

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP4_MOP"
    id: notification_prepare_map4_mop

  # Sweep-only fallback triggers (when mop not ready)
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP1_SWEEP_FALLBACK"
    id: notification_prepare_map1_sweep_fallback

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP2_SWEEP_FALLBACK"
    id: notification_prepare_map2_sweep_fallback

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP3_SWEEP_FALLBACK"
    id: notification_prepare_map3_sweep_fallback

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PREPARE_MAP4_SWEEP_FALLBACK"
    id: notification_prepare_map4_sweep_fallback

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "SKIP_CLEANING"
    id: notification_skip

  # Pickup Actions
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "START_CLEANING"
    id: notification_start

  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "CANCEL_CLEANING"
    id: notification_cancel

# ========================================
# VARIABLEN
# ========================================
variables:
  # Input Werte importieren - Roboter Entitäten
  vacuum_entity: !input vacuum_entity

  # Map handling settings
  auto_discard_temp_map: !input auto_discard_temporary_map
  has_temporary_map: "{{ state_attr(vacuum_entity, 'has_temporary_map') | default(false) }}"

  # ========================================
  # AUTO-DETECTION: Extract base name from vacuum entity
  # ========================================
  # Pattern: vacuum.helene_wischer → helene_wischer
  # Schema: [domain].[vacuum_name]_[entity_name]
  vacuum_base_name: "{{ vacuum_entity.split('.')[1] }}"

  # ========================================
  # ACTIVE ENTITIES (Auto-Detected)
  # ========================================
  # These are the active entities used throughout the automation
  cleaning_mode_select: "select.{{ vacuum_base_name }}_cleaning_mode"
  selected_map_select: "select.{{ vacuum_base_name }}_selected_map"
  map_camera: "camera.{{ vacuum_base_name }}_map"
  self_clean_switch: "switch.{{ vacuum_base_name }}_self_clean"
  self_clean_button: "button.{{ vacuum_base_name }}_self_clean"
  charging_status_sensor: "sensor.{{ vacuum_base_name }}_charging_status"
  stop_drying_button: "button.{{ vacuum_base_name }}_manual_drying"

  # Task status sensor for auto-switch detection (auto-detected for Actions)
  task_status_sensor: "sensor.{{ vacuum_base_name }}_task_status"
  self_wash_base_status_sensor: "sensor.{{ vacuum_base_name }}_self_wash_base_status"

  # ========================================
  # ERROR DETECTION
  # ========================================
  error_entity: "sensor.{{ vacuum_base_name }}_error"
  error_message: >
    {% set error_state = states(error_entity) %}
    {% if error_state not in ['unknown', 'unavailable', 'no_error', 'none'] %}
      {{ error_state }}
    {% else %}
      Unknown error
    {% endif %}

  # ========================================
  # MAP CONFIGURATION (Fully Auto-Detected)
  # ========================================
  # Auto-detect all map names from map camera entities
  # Format: camera.{robot}_map_1, _map_2, etc.
  # Extracts: custom_name (if set) or map_name (default)
  map_1_name: >
    {% set map_entity = 'camera.' ~ vacuum_base_name ~ '_map_1' %}
    {% if has_value(map_entity) %}
      {% set custom = state_attr(map_entity, 'custom_name') %}
      {{ custom if custom else state_attr(map_entity, 'map_name') }}
    {% else %}
      Map 1
    {% endif %}

  map_2_name: >
    {% set map_entity = 'camera.' ~ vacuum_base_name ~ '_map_2' %}
    {% if has_value(map_entity) %}
      {% set custom = state_attr(map_entity, 'custom_name') %}
      {{ custom if custom else state_attr(map_entity, 'map_name') }}
    {% else %}
      Map 2
    {% endif %}

  map_3_name: >
    {% set map_entity = 'camera.' ~ vacuum_base_name ~ '_map_3' %}
    {% if has_value(map_entity) %}
      {% set custom = state_attr(map_entity, 'custom_name') %}
      {{ custom if custom else state_attr(map_entity, 'map_name') }}
    {% else %}
      Map 3
    {% endif %}

  map_4_name: >
    {% set map_entity = 'camera.' ~ vacuum_base_name ~ '_map_4' %}
    {% if has_value(map_entity) %}
      {% set custom = state_attr(map_entity, 'custom_name') %}
      {{ custom if custom else state_attr(map_entity, 'map_name') }}
    {% else %}
      Map 4
    {% endif %}

  # ========================================
  # BASE STATION MAP RESOLUTION
  # ========================================
  # Priority: user-configured name (validated) > charger_position auto-detection
  #
  # Auto-detection is unreliable: maps keep a stale charger_position after the base
  # station moves, and this loop has no break, so the LAST match wins. Map slots also
  # re-sort when the robot auto-creates a map, and map_id changes with every map
  # version - the map NAME is the only stable identifier.
  base_station_map_input: !input base_station_map_name

  # Fallback only - kept unchanged so an unconfigured blueprint behaves as before.
  base_station_map_auto: >
    {% set ns = namespace(found='') %}
    {% for i in range(1, 5) %}
      {% set map_entity = 'camera.' ~ vacuum_base_name ~ '_map_' ~ i %}
      {% if has_value(map_entity) %}
        {% set charger_pos = state_attr(map_entity, 'charger_position') %}
        {% if charger_pos is not none %}
          {% set ns.found = state_attr(map_entity, 'custom_name') | default(state_attr(map_entity, 'map_name'), true) %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.found if ns.found != '' else 'Map 1' }}

  # Valid = non-empty AND matches one of map_1_name..map_4_name.
  # map_*_name come from `>` folded scalars, so trim both sides. `| string` first:
  # HA literal-evaluates a map named "2" into an int, which `| trim` would choke on.
  base_station_map_configured: >
    {% set cfg = (base_station_map_input | default('', true)) | string | trim %}
    {% set names = [map_1_name, map_2_name, map_3_name, map_4_name] | map('string') | map('trim') | list %}
    {{ cfg != '' and cfg in names }}

  base_station_map: >
    {% set cfg = (base_station_map_input | default('', true)) | string | trim %}
    {{ cfg if base_station_map_configured else base_station_map_auto }}

  # Set when the user typed a name that matches no map -> warn, but never abort.
  base_station_map_misconfigured: >
    {% set cfg = (base_station_map_input | default('', true)) | string | trim %}
    {{ cfg != '' and not base_station_map_configured }}

  # ========================================
  # PER-MAP CONFIGURATION STRUCTURE
  # ========================================
  # Simple per-map configuration without complex segment pre-calculation
  # Segments are extracted dynamically from current map camera (lazy evaluation)
  # This prevents template rendering errors when camera entities are unavailable
  map_config:
    map_1:
      name: "{{ map_1_name }}"
      cleaning_repeats: !input map_1_cleaning_repeats
      sweep_schedule: !input map_1_sweep_schedule
      mop_schedule: !input map_1_mop_schedule
      has_base_station: "{{ map_1_name == base_station_map }}"
    map_2:
      name: "{{ map_2_name }}"
      cleaning_repeats: !input map_2_cleaning_repeats
      sweep_schedule: !input map_2_sweep_schedule
      mop_schedule: !input map_2_mop_schedule
      has_base_station: "{{ map_2_name == base_station_map }}"
    map_3:
      name: "{{ map_3_name }}"
      cleaning_repeats: !input map_3_cleaning_repeats
      sweep_schedule: !input map_3_sweep_schedule
      mop_schedule: !input map_3_mop_schedule
      has_base_station: "{{ map_3_name == base_station_map }}"
    map_4:
      name: "{{ map_4_name }}"
      cleaning_repeats: !input map_4_cleaning_repeats
      sweep_schedule: !input map_4_sweep_schedule
      mop_schedule: !input map_4_mop_schedule
      has_base_station: "{{ map_4_name == base_station_map }}"

  # ========================================
  # CUSTOMIZED CLEANING FEATURE DETECTION
  # ========================================
  use_cleaning_sequence_input: !input use_cleaning_sequence
  use_customized_cleaning_input: !input use_customized_cleaning

  # Check if switches are available
  cleaning_sequence_available: "{{ has_value('switch.' ~ vacuum_base_name ~ '_cleaning_sequence') }}"
  customized_cleaning_available: "{{ has_value('switch.' ~ vacuum_base_name ~ '_customized_cleaning') }}"

  # Determine if features should be used
  should_use_cleaning_sequence: "{{ use_cleaning_sequence_input and cleaning_sequence_available }}"
  should_use_customized_cleaning: "{{ use_customized_cleaning_input and customized_cleaning_available }}"

  # ========================================
  # CLEANING SETTINGS (Must be defined BEFORE is_cleaning/is_paused)
  # ========================================
  mode_sweeping: !input sweeping_mode_value
  mode_sweeping_mopping: !input sweeping_mopping_mode_value

  # Every cleaning mode that COUNTS as a mop program - a predicate, not a setter.
  # mode_sweeping_mopping is the mode we SELECT when a mop program is requested;
  # this is the set we TEST the CURRENT mode against. Keeping them apart means a
  # robot already sitting in a wet mode (set in the Dreame app, or left over from a
  # previous run) is still recognised as mopping, so the mop-readiness check and the
  # mop wash still run for it.
  mop_modes: >
    {{ ([mode_sweeping_mopping] +
        ['sweeping_and_mopping', 'mopping', 'mopping_after_sweeping'])
       | map('string') | map('trim') | reject('eq', '') | unique | list }}
  global_cleaning_repeats: !input global_cleaning_repeats
  cleaning_states_raw: !input cleaning_states
  cleaning_states: "{{ cleaning_states_raw.split(',') }}"

  # States that mean "the job has actually started" = cleaning_states minus 'returning'.
  # 'returning' MUST be excluded: mopping_after_sweeping goes cleaning -> returning ->
  # cleaning mid-job (the robot hunts for a dock to rinse the mop between the sweep and
  # the mop pass, ~1 min when the map has no base station), and a docking robot reports
  # 'returning' too. The default cleaning_states list is a union of the
  # sensor.{robot}_status vocabulary (cleaning/room_cleaning/zone_cleaning) and the
  # sensor.{robot}_state vocabulary (sweeping/mopping/...), so one list serves both.
  start_detect_states: "{{ cleaning_states | map('trim') | reject('eq', 'returning') | list }}"
  paused_states_raw: !input paused_states
  paused_states: "{{ paused_states_raw.split(',') }}"
  error_states_raw: !input error_states
  error_states: "{{ error_states_raw.split(',') if error_states_raw else [] }}"
  idle_states_raw: !input idle_states
  idle_states: "{{ idle_states_raw.split(',') if idle_states_raw else [] }}"
  base_warning_states_raw: !input base_warning_states
  base_warning_states: "{{ base_warning_states_raw.split(',') if base_warning_states_raw else [] }}"

  # ========================================
  # ENTITY STATE CHECKS
  # ========================================
  # IMPORTANT: These must come AFTER cleaning_states/paused_states definition
  current_status: "{{ states('sensor.' ~ vacuum_base_name ~ '_status') }}"
  current_mode: "{{ states(cleaning_mode_select) }}"
  current_map_name: "{{ states(selected_map_select) }}"
  current_map_id: "{{ state_attr(selected_map_select, 'map_id') }}"

  # ========================================
  # CURRENT MAP CONTEXT (Dynamic Lookup)
  # ========================================
  # Dynamically select map config based on current_map_name
  # Robust with fallbacks to prevent undefined errors
  # IMPORTANT: Must come BEFORE variables that use it (like repeats, is_base_station_map)
  current_map_config: >
    {% set map_lookup = {
      map_1_name: map_config.map_1,
      map_2_name: map_config.map_2,
      map_3_name: map_config.map_3,
      map_4_name: map_config.map_4
    } %}
    {% set config = map_lookup.get(current_map_name, map_config.map_1) %}
    {{ config if config is mapping and config.name is defined else map_config.map_1 }}

  # Boolean Evaluations with robust defaults
  # Compare directly against base_station_map instead of going through
  # current_map_config: identical for the four known maps, but correct while a
  # TEMPORARY map is active (the lookup fell back to map_1 and reported map 1's
  # base-station-ness for any unknown map).
  is_base_station_map: "{{ current_map_name == base_station_map }}"
  is_cleaning: "{{ current_status in cleaning_states }}"
  is_busy: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') == 'washing' or current_status in cleaning_states }}"
  is_paused: "{{ current_status in paused_states and states(vacuum_entity) != 'docked' }}"
  is_docked: "{{ states(vacuum_entity) == 'docked' }}"
  has_cleaning_sequence: "{{ should_use_cleaning_sequence }}"
  has_customized_cleaning: "{{ should_use_customized_cleaning }}"
  is_error: "{{ current_status in error_states }}"
  is_idle: "{{ current_status in idle_states }}"
  current_base_status: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') }}"
  is_base_warning: "{{ current_base_status in base_warning_states }}"

  # Mop readiness check (for sweep+mop mode)
  mop_pad_status: "{{ states('sensor.' ~ vacuum_base_name ~ '_mop_pad') }}"
  water_warning_status: "{{ states('sensor.' ~ vacuum_base_name ~ '_low_water_warning') }}"
  mop_ready: "{{ mop_pad_status == 'installed' and water_warning_status == 'no_warning' }}"

  # Per-map cleaning repeats take priority, fall back to global setting
  repeats: "{{ current_map_config.cleaning_repeats | default(global_cleaning_repeats) | default(2) }}"
  moistening_status: !input moistening_status
  pause_delay_after_undock: !input pause_delay_after_undock
  sweep_start_timeout: !input sweep_start_timeout
  mop_start_timeout: !input mop_start_timeout
  moistening_timeout: !input moistening_timeout
  use_segment_service: !input use_segment_service
  debug_level: !input debug_level
  debug_info: "{{ debug_level | int >= 1 }}"
  debug_verbose: "{{ debug_level | int >= 2 }}"

  # ========================================
  # AUTO-SWITCH TO BASE MAP FEATURE
  # ========================================
  auto_switch_to_base_enabled: !input auto_switch_to_base_map

  # Preparation tracking (for schedule workflow collision detection)
  preparation_active: >
    {{ trigger.id in ['notification_prepare', 'notification_start'] if trigger.id is defined else false }}

  # Time since last preparation pause (20s safety buffer)
  last_pause_time: "{{ as_timestamp(states[vacuum_entity].last_changed) if states[vacuum_entity].state == 'paused' else 0 }}"
  time_since_pause: "{{ (as_timestamp(now()) - last_pause_time) if last_pause_time > 0 else 999 }}"

  # ========================================
  # NOTIFICATION TEMPLATE VARIABLES
  # ========================================
  # Variables available in notification templates for flexible customization
  robot_name: "{{ vacuum_base_name | replace('_', ' ') | title }}"

  cleaning_mode_display: >
    {% if current_mode == mode_sweeping %}{{ sweep_display | default('Sweep') }}
    {% elif current_mode in mop_modes %}{{ sweep_mop_display | default('Sweep+Mop') }}
    {% else %}{{ current_mode }}{% endif %}

  current_time: "{{ now().strftime('%H:%M') }}"

  # Notification input imports (shared settings)
  notification_enabled: !input notification_enabled
  notification_persons: !input notification_persons
  notification_groups: !input notification_groups
  notification_interruption_level: !input notification_interruption_level
  notification_sound: !input notification_sound
  notification_critical: !input notification_critical
  notification_volume: !input notification_volume

  # ========================================
  # LOCALIZATION
  # ========================================
  # User-customizable display texts for multilingual notifications
  sweep_display: !input sweep_display_text
  mop_display: !input mop_display_text
  sweep_mop_display: !input sweep_mop_display_text
  prepare_button: !input prepare_button_text
  skip_button: !input skip_button_text
  start_cleaning_button: !input start_cleaning_button_text
  cancel_cleaning_button: !input cancel_cleaning_button_text
  sweep_only_button: !input sweep_only_button_text
  mop_not_ready_title: !input mop_not_ready_title
  mop_not_ready_message: !input mop_not_ready_message

  # ========================================
  # SCHEDULE HANDLING & CONFLICT DETECTION
  # ========================================
  # Import schedule entity references
  map_1_sweep_schedule_entity: !input map_1_sweep_schedule
  map_1_mop_schedule_entity: !input map_1_mop_schedule
  map_2_sweep_schedule_entity: !input map_2_sweep_schedule
  map_2_mop_schedule_entity: !input map_2_mop_schedule
  map_3_sweep_schedule_entity: !input map_3_sweep_schedule
  map_3_mop_schedule_entity: !input map_3_mop_schedule
  map_4_sweep_schedule_entity: !input map_4_sweep_schedule
  map_4_mop_schedule_entity: !input map_4_mop_schedule

  # Detect if this is a schedule-triggered cleaning
  is_schedule_trigger: >
    {{ trigger.id is defined and trigger.id.startswith('schedule_') }}

  # Conflict detection: Check if another schedule is already running
  # Only 1 schedule can be active at a time (silent abort on conflict)
  schedule_conflict_detected: >
    {% if is_schedule_trigger %}
      {# Check if robot is currently cleaning (excluding paused states) #}
      {% set is_currently_cleaning = states('sensor.' ~ vacuum_base_name ~ '_status') in cleaning_states and states('sensor.' ~ vacuum_base_name ~ '_status') not in paused_states %}
      {{ is_currently_cleaning }}
    {% else %}
      false
    {% endif %}

  # Current schedule trigger info (for debugging and notification context)
  schedule_trigger_map: >
    {% if trigger.id in ['schedule_map1_sweep', 'schedule_map1_mop'] %}1
    {% elif trigger.id in ['schedule_map2_sweep', 'schedule_map2_mop'] %}2
    {% elif trigger.id in ['schedule_map3_sweep', 'schedule_map3_mop'] %}3
    {% elif trigger.id in ['schedule_map4_sweep', 'schedule_map4_mop'] %}4
    {% else %}unknown{% endif %}

  schedule_trigger_mode: >
    {% if trigger.id in ['schedule_map1_sweep', 'schedule_map2_sweep', 'schedule_map3_sweep', 'schedule_map4_sweep'] %}sweep
    {% elif trigger.id in ['schedule_map1_mop', 'schedule_map2_mop', 'schedule_map3_mop', 'schedule_map4_mop'] %}mop
    {% else %}unknown{% endif %}

  schedule_trigger_map_name: >
    {% if trigger.id in ['schedule_map1_sweep', 'schedule_map1_mop'] %}{{ map_1_name }}
    {% elif trigger.id in ['schedule_map2_sweep', 'schedule_map2_mop'] %}{{ map_2_name }}
    {% elif trigger.id in ['schedule_map3_sweep', 'schedule_map3_mop'] %}{{ map_3_name }}
    {% elif trigger.id in ['schedule_map4_sweep', 'schedule_map4_mop'] %}{{ map_4_name }}
    {% else %}Unknown{% endif %}

  # ========================================
  # FUNCTION ROUTING (Hybrid: ID, Device Trigger, or MQTT Payload)
  # ========================================
  # Priority 1: User-set trigger.id
  # Priority 2: Device Trigger subtype (Zigbee2MQTT device actions)
  # Priority 3: MQTT payload fallback
  # Result: "fn_sweep", "fn_mop", "fn_start", "fn_map1", "fn_map2", "fn_map3", or "unknown"
  #
  action_to_function_map:
    "1_single": "fn_sweep"
    "2_single": "fn_mop"
    "3_single": "fn_start"
    "4_single": "fn_map1"
    "5_single": "fn_map2"
    "6_single": "fn_map3"
    "7_single": "fn_map4"

  triggered_function: >
    {% if trigger.id is defined and trigger.id != '' %}
      {{ trigger.id }}
    {% elif trigger.platform in ['device', 'mqtt'] %}
      {% set action = trigger.subtype if trigger.platform == 'device' else (trigger.payload_json.action | default('')) %}
      {{ action_to_function_map.get(action, 'unknown') }}
    {% else %}unknown{% endif %}

  # Display name for debug notifications (human-readable function names)
  function_display_name: >
    {% set names = {
      'fn_sweep': 'Sweep Mode',
      'fn_mop': 'Mop Mode',
      'fn_start': 'Smart Start',
      'fn_map1': 'Map 1',
      'fn_map2': 'Map 2',
      'fn_map3': 'Map 3',
      'fn_map4': 'Map 4',
      'fn_room': 'Single Room',
      'setup_required': 'Setup Required',
      'auto_switch_to_base': 'Auto-Switch'
    } %}
    {% if triggered_function.startswith('schedule_') %}Schedule
    {% elif triggered_function.startswith('notification_') %}Notification
    {% else %}{{ names.get(triggered_function, triggered_function) }}{% endif %}

  # Room/Segment Data Processing (Hybrid: supports both rooms and segments)
  # Priority 1: rooms (extract room_id values)
  # Priority 2: segments (extract segment_id or keys)
  # Room/Segment Data Processing (simplified with filters)
  # Extract room_id from rooms dict (preferred) - with entity availability check
  room_ids: >
    {% if has_value(map_camera) %}
      {% set rooms = state_attr(map_camera, 'rooms') %}
      {{ rooms.values() | map(attribute='room_id') | list if rooms is mapping else [] }}
    {% else %}
      []
    {% endif %}

  # Extract segment_id from segments dict (fallback: use keys if segment_id unavailable) - with entity availability check
  segment_ids: >
    {% if has_value(map_camera) %}
      {% set segs = state_attr(map_camera, 'segments') %}
      {% if segs is mapping %}
        {% set seg_ids = segs.values() | map(attribute='segment_id') | list %}
        {{ seg_ids if seg_ids | length > 0 else (segs.keys() | map('int') | list) }}
      {% else %}
        []
      {% endif %}
    {% else %}
      []
    {% endif %}

  # Prioritize rooms, fallback to segments, empty if neither available
  map_segments: "{{ room_ids if room_ids | length > 0 else segment_ids }}"
  has_segments: "{{ map_segments | length > 0 }}"
  segments_source: "{{ 'rooms' if room_ids | length > 0 else ('segments' if segment_ids | length > 0 else 'none') }}"

  # ========================================
  # SINGLE ROOM CLEANING (fn_room)
  # ========================================
  # Defined last so every dependency above is already in scope.
  #
  # `variables:` is rendered for EVERY trigger, so trigger.event must never be touched
  # unless this really is an event trigger - otherwise every other trigger path breaks.
  # Jinja's inline-if is lazy, so `X if room_evt_ok else Y` is a real guard.
  #
  # Always read event data with .get(). Under Jinja's getattr-first rule
  # trigger.event.data.keys / .items / .values / .get / .pop resolve to dict METHODS,
  # not to payload keys.
  room_evt_ok: >
    {{ (trigger.platform | default('')) == 'event'
       and trigger.event is defined
       and trigger.event.data is defined
       and trigger.event.data is mapping }}

  room_target_map_num:  "{{ (trigger.event.data.get('map',  0)        if room_evt_ok else 0)       | int(0) }}"
  room_target_room_id:  "{{ (trigger.event.data.get('room', 0)        if room_evt_ok else 0)       | int(0) }}"
  room_target_mode_key: "{{ ((trigger.event.data.get('mode', 'sweep') if room_evt_ok else 'sweep') | string | lower | trim) }}"

  room_target_is_mop: "{{ room_target_mode_key in ['mop', 'mopping', 'wischen', 'sweep_mop'] }}"
  room_target_mode:   "{{ mode_sweeping_mopping if room_target_is_mop else mode_sweeping }}"

  room_target_map_name: >
    {% set names = [map_1_name, map_2_name, map_3_name, map_4_name] %}
    {{ (names[room_target_map_num - 1] | string | trim) if 1 <= room_target_map_num <= 4 else '' }}

  room_target_repeats: >
    {% if 1 <= room_target_map_num <= 4 %}
      {{ map_config['map_' ~ room_target_map_num].cleaning_repeats | default(global_cleaning_repeats) | default(2) }}
    {% else %}{{ global_cleaning_repeats | default(2) }}{% endif %}

  # Rooms come from the TARGET map's own SLOT camera, never the live camera.
  # The slot camera is unaffected by map switching, so - unlike the map_segments
  # above, which is computed at trigger time from the pre-switch live map - this is
  # not stale when the target map is not the one currently loaded.
  room_target_rooms: >
    {% if 1 <= room_target_map_num <= 4 %}
      {% set cam = 'camera.' ~ vacuum_base_name ~ '_map_' ~ room_target_map_num %}
      {% set rooms = state_attr(cam, 'rooms') if has_value(cam) else none %}
      {{ rooms if rooms is mapping else {} }}
    {% else %}{{ {} }}{% endif %}

  # Visible rooms only: slot cameras also list rooms with visibility 'Hidden' that the
  # live map omits and the robot will not clean.
  room_target_room_ids: >
    {% set ns = namespace(ids=[]) %}
    {% for rid, r in room_target_rooms.items() %}
      {% if r.get('visibility', 'Visible') != 'Hidden' %}
        {% set ns.ids = ns.ids + [ r.get('room_id', rid) | int(-1) ] %}
      {% endif %}
    {% endfor %}
    {{ ns.ids }}

  room_target_room_valid: "{{ room_target_room_id in room_target_room_ids }}"

  room_target_room_name: >
    {% set ns = namespace(n='') %}
    {% for rid, r in room_target_rooms.items() %}
      {% if (r.get('room_id', rid) | int(-1)) == room_target_room_id %}
        {% set ns.n = r.get('custom_name') | default(r.get('name'), true) | default('', true) %}
      {% endif %}
    {% endfor %}
    {{ ns.n if ns.n else ('Room ' ~ room_target_room_id) }}

# ========================================
# ACTIONS
# ========================================
actions:
  # ========================================
  # Debug Notification (Level 2 - Verbose)
  # ========================================
  - if: "{{ debug_verbose }}"
    then:
      - action: persistent_notification.create
        data:
          title: "⚙️ Trigger: {{ function_display_name }}"
          message: |
            {{ now().strftime('%H:%M:%S') }}

            **Status:** {{ current_status }}
            **Map:** {{ current_map_name }}
            **Cleaning-Mode:** {{ current_mode }}
            **Cleaning:** {{ is_cleaning }}
            **Paused:** {{ is_paused }}
            **Segments:** {{ map_segments | length }}{% if is_schedule_trigger %}
            **Schedule:** {{ schedule_trigger_map_name }}{% endif %}

  # ========================================
  # CONFIG WARNING: Base station map name not found
  # ========================================
  # Standalone `if` on purpose - NOT a branch of the choose below. That choose takes
  # only the FIRST matching branch and every branch ends in `stop:`, so a config
  # warning placed there would be swallowed whenever the robot also has an error.
  # Warn and continue with auto-detection; never abort.
  - if: "{{ base_station_map_misconfigured }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: "dreame_base_map_config_{{ vacuum_base_name }}"
          title: "⚠️ Base Station Map Not Found"
          message: |
            {{ now().strftime('%H:%M:%S') }}

            ├─ ⚠️ **Configured:** `{{ base_station_map_input }}`
            ├─ ○ **Available:** {{ map_1_name }}, {{ map_2_name }}, {{ map_3_name }}, {{ map_4_name }}
            └─ ✔ **Fallback:** {{ base_station_map_auto }}
    else:
      # Clear the warning once the name is corrected
      - action: persistent_notification.dismiss
        continue_on_error: true
        data:
          notification_id: "dreame_base_map_config_{{ vacuum_base_name }}"

  # ========================================
  # ERROR AND WARNING DETECTION
  # ========================================
  # Check error/warning states first, before processing functions
  # Allows early exit with notification if robot in critical state
  - choose:
      # ========================================
      # ERROR STATE DETECTED
      # ========================================
      - conditions:
          - condition: or
            conditions:
              # Check 1: Status sensor in error states
              - condition: template
                value_template: "{{ is_error }}"
              # Check 2: Error entity has actual error
              - condition: template
                value_template: >
                  {{ states(error_entity) not in ['no_error', 'unknown', 'unavailable', 'none'] }}
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚠️ {{ robot_name }} - Robot Error"
              message: |
                {{ now().strftime('%H:%M:%S') }}

                **Status:** {{ current_status }}
                **Error:** {{ error_message }}

                *Automation aborted*
              notification_id: "dreame_error_{{ vacuum_base_name }}"
          - stop: "Robot in error state: {{ error_message }}"
            error: true

      # ========================================
      # BASE STATION WARNING DETECTED
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ is_base_warning }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚠️ Base Warning"
              message: |
                {{ now().strftime('%H:%M:%S') }}

                **Status:** {{ current_base_status }}
              notification_id: "dreame_base_warning_{{ vacuum_base_name }}"
          - stop: "Base station warning, aborting automation"
            error: true

  # ========================================
  # MAIN LOGIC - Function Routing (by trigger.id)
  # ========================================
  - choose:
      # ========================================
      # SETUP REQUIRED HANDLER
      # ========================================
      # This handles the fallback trigger and shows setup instructions
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'setup_required' }}"
        sequence:
          - action: persistent_notification.create
            data:
              title: "⚠️ Setup Required"
              message: |
                {{ now().strftime('%H:%M:%S') }}

                No functions configured.
                Add triggers and enable functions.

      # ========================================
      # FUNCTION 1: Sweep Only Mode (fn_sweep)
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_sweep' }}"
        sequence:
          # Busy check: Ignore trigger if robot is washing or cleaning
          - if: "{{ is_busy }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** fn_sweep
                    **Status:** {{ current_base_status if current_base_status == 'washing' else current_status }}

                    ❌ Automation aborted
              - stop: "Robot busy"

          # Track old values for summary
          - variables:
              _old_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
              _old_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"

          # Disable customized_cleaning if active (enables global cleaning_mode)
          - if: "{{ _old_customized }}"
            then:
              - action: switch.turn_off
                continue_on_error: true
                target:
                  entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"
              - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'off') }}"
                timeout: 10
                continue_on_timeout: false

          # Set mode to sweeping
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ cleaning_mode_select }}"
            data:
              option: "{{ mode_sweeping }}"

          # Track new values
          - variables:
              _new_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
              _new_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"
              _customized_changed: "{{ _old_customized and not _new_customized }}"
              _mode_changed: "{{ _old_mode != _new_mode }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🧹 Sweep Mode"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ✔ **Customized:** {% if _customized_changed %}on → **off**{% else %}off{% endif %}
                    └─ ✔ **Cleaning-Mode:** {% if _mode_changed %}{{ _old_mode }} → **{{ _new_mode }}**{% else %}{{ _new_mode }}{% endif %}

      # ========================================
      # FUNCTION 2: Sweep + Mop Mode (fn_mop)
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_mop' }}"
        sequence:
          # Busy check: Ignore trigger if robot is washing or cleaning
          - if: "{{ is_busy }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** fn_mop
                    **Status:** {{ current_base_status if current_base_status == 'washing' else current_status }}

                    ❌ Automation aborted
              - stop: "Robot busy"

          # Track old values for summary
          - variables:
              _old_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
              _old_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"

          # Disable customized_cleaning if active (enables global cleaning_mode)
          - if: "{{ _old_customized }}"
            then:
              - action: switch.turn_off
                continue_on_error: true
                target:
                  entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"
              - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'off') }}"
                timeout: 10
                continue_on_timeout: false

          # Set mode to sweeping+mopping
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ cleaning_mode_select }}"
            data:
              option: "{{ mode_sweeping_mopping }}"

          # Track new values
          - variables:
              _new_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
              _new_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"
              _customized_changed: "{{ _old_customized and not _new_customized }}"
              _mode_changed: "{{ _old_mode != _new_mode }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "💧 Mop Mode"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ✔ **Customized:** {% if _customized_changed %}on → **off**{% else %}off{% endif %}
                    └─ ✔ **Cleaning-Mode:** {% if _mode_changed %}{{ _old_mode }} → **{{ _new_mode }}**{% else %}{{ _new_mode }}{% endif %}

      # ========================================
      # FUNCTION 3: Smart Start/Pause/Resume (fn_start)
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_start' }}"
        sequence:
          # Busy check: Only block during washing (pause/resume still works during cleaning)
          - if: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') == 'washing' }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** fn_start
                    **Status:** washing

                    ❌ Automation aborted
              - stop: "Robot busy (washing)"

          - choose:
              # Robot is cleaning → Pause
              - conditions:
                  - condition: template
                    value_template: "{{ is_cleaning }}"
                sequence:
                  - action: vacuum.pause
                    continue_on_error: true
                    target:
                      entity_id: "{{ vacuum_entity }}"

                  # Summary notification (Level 1+)
                  - if: "{{ debug_info }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "⏸️ Paused"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            └─ ✔ **Action:** {{ current_status }} → paused

              # Robot is paused → Resume
              - conditions:
                  - condition: template
                    value_template: "{{ is_paused }}"
                sequence:
                  - action: vacuum.start
                    continue_on_error: true
                    target:
                      entity_id: "{{ vacuum_entity }}"

                  # Summary notification (Level 1+)
                  - if: "{{ debug_info }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "▶️ Resumed"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            └─ ✔ **Action:** paused → cleaning

            # Default: Robot idle → Start Cleaning
            default:
              - choose:
                  # On base station map → Start directly
                  - conditions:
                      - condition: template
                        value_template: "{{ is_base_station_map }}"
                    sequence:
                      # Track old values for summary
                      - variables:
                          _fn_start: "{{ now().timestamp() }}"
                          _old_self_clean: "{{ is_state(self_clean_switch, 'on') if has_value(self_clean_switch) else 'n/a' }}"
                          _old_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
                          _old_sequence: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                          _self_clean_changed: false
                          _customized_changed: false
                          _sequence_changed: false

                      # Ensure self_clean is ALWAYS ON for base station cleaning
                      - if: "{{ has_value(self_clean_switch) and is_state(self_clean_switch, 'off') }}"
                        then:
                          - action: switch.turn_on
                            target:
                              entity_id: "{{ self_clean_switch }}"
                          - variables:
                              _self_clean_changed: true

                      # Enable customized cleaning features (base station map)
                      - if: "{{ has_customized_cleaning and current_mode in mop_modes }}"
                        then:
                          - if: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'off') }}"
                            then:
                              - action: switch.turn_on
                                target:
                                  entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"
                              - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
                                timeout: 5
                                continue_on_timeout: false
                              - variables:
                                  _customized_changed: true

                      - if: "{{ has_cleaning_sequence }}"
                        then:
                          - if: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'off') }}"
                            then:
                              - action: switch.turn_on
                                target:
                                  entity_id: "switch.{{ vacuum_base_name }}_cleaning_sequence"
                              - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                                timeout: 5
                                continue_on_timeout: false
                              - variables:
                                  _sequence_changed: true

                      # Start cleaning
                      - variables:
                          _use_segments: "{{ use_segment_service and has_segments }}"

                      - if: "{{ _use_segments }}"
                        then:
                          - action: dreame_vacuum.vacuum_clean_segment
                            continue_on_error: true
                            target:
                              entity_id: "{{ vacuum_entity }}"
                            data:
                              segments: "{{ map_segments }}"
                              repeats: "{{ repeats }}"
                        else:
                          - action: vacuum.start
                            target:
                              entity_id: "{{ vacuum_entity }}"

                      # Summary notification (Level 1+)
                      - if: "{{ debug_info }}"
                        then:
                          - action: persistent_notification.create
                            data:
                              title: "🚀 Start Complete"
                              message: |
                                {{ now().strftime('%H:%M:%S') }}

                                {% if has_value(self_clean_switch) %}├─ ✔ **Self-Clean:** {% if _self_clean_changed %}off → **on**{% else %}on{% endif %}
                                {% endif %}{% if has_customized_cleaning %}├─ ✔ **Customized:** {% if _customized_changed %}off → **on**{% else %}{{ 'on' if is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') else 'off' }}{% endif %}
                                {% endif %}{% if has_cleaning_sequence %}├─ ✔ **Sequence:** {% if _sequence_changed %}off → **on**{% else %}{{ 'on' if is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') else 'off' }}{% endif %}
                                {% endif %}└─ ✔ **Start:** {% if _use_segments %}{{ map_segments | length }} segments{% else %}full map{% endif %}

                                **Map:** {{ current_map_name }}
                                **Cleaning-Mode:** {{ current_mode | replace('_', ' ') | title }}
                                **Duration:** {{ ((now().timestamp() - _fn_start) | round(1)) }}s

                # On other map → Start and pause (for manual transport)
                default:
                  # Initialize tracking variables
                  - variables:
                      _fn_start: "{{ now().timestamp() }}"
                      _is_mop_mode: "{{ current_mode in mop_modes }}"
                      _old_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
                      _old_sequence: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                      _old_self_clean: "{{ is_state(self_clean_switch, 'on') if has_value(self_clean_switch) else false }}"
                      _stopped_drying: false
                      _wash_duration: 0
                      _customized_changed: false
                      _sequence_changed: false
                      _self_clean_changed: false

                  # Mop readiness check for smart start (non-base station)
                  - if: "{{ _is_mop_mode and not mop_ready }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "⚠️ Mop Not Ready"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            **Mop Pad:** {{ mop_pad_status }}
                            **Water:** {{ water_warning_status }}

                            ❌ Automation aborted
                          notification_id: "mop_not_ready_{{ vacuum_base_name }}"
                      - stop: "Mop not ready"
                        error: true

                  # Sweep+Mop mode: Prepare base station for mop washing
                  - if: "{{ _is_mop_mode }}"
                    then:
                      # Stop drying if active
                      - if: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') == 'drying' }}"
                        then:
                          - action: button.press
                            continue_on_error: true
                            target:
                              entity_id: "{{ stop_drying_button }}"
                          - wait_template: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') != 'drying' }}"
                            timeout: 10
                            continue_on_timeout: true
                          - variables:
                              _stopped_drying: true

                      # Start manual mop washing
                      - variables:
                          _wash_start: "{{ now().timestamp() }}"
                      - action: button.press
                        continue_on_error: true
                        target:
                          entity_id: "{{ self_clean_button }}"

                      # Wait for washing to complete
                      - wait_template: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') == 'washing' }}"
                        timeout:
                          seconds: "{{ mop_start_timeout }}"
                        continue_on_timeout: true
                      - wait_template: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') != 'washing' }}"
                        timeout:
                          seconds: "{{ moistening_timeout }}"
                        continue_on_timeout: true
                      - variables:
                          _wash_duration: "{{ (now().timestamp() - _wash_start) | round(0) | int }}"
                          _current_base_status: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') }}"

                      # Force-stop if timeout and still washing/drying
                      - if: "{{ not wait.completed and _current_base_status in ['washing', 'drying'] }}"
                        then:
                          - if: "{{ _current_base_status == 'washing' }}"
                            then:
                              - action: button.press
                                target:
                                  entity_id: "button.{{ vacuum_base_name }}_self_clean"
                                continue_on_error: true
                          - if: "{{ _current_base_status == 'drying' }}"
                            then:
                              - action: button.press
                                target:
                                  entity_id: "button.{{ vacuum_base_name }}_manual_drying"
                                continue_on_error: true
                          - delay:
                              seconds: 3

                  # Skip start if delay=0 (keep robot docked)
                  - if: "{{ pause_delay_after_undock == 0 }}"
                    then:
                      - if: "{{ debug_info }}"
                        then:
                          - action: persistent_notification.create
                            data:
                              title: "⏭️ Skipped (delay=0)"
                              message: |
                                {{ now().strftime('%H:%M:%S') }}

                                └─ ✔ **Status:** docked (no start)
                      - stop: "Delay is 0, robot stays docked"

                  # Enable customized cleaning features
                  - if: "{{ has_customized_cleaning and _is_mop_mode and not _old_customized }}"
                    then:
                      - action: switch.turn_on
                        target:
                          entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"
                      - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
                        timeout: 5
                        continue_on_timeout: false
                      - variables:
                          _customized_changed: true

                  - if: "{{ has_cleaning_sequence and not _old_sequence }}"
                    then:
                      - action: switch.turn_on
                        target:
                          entity_id: "switch.{{ vacuum_base_name }}_cleaning_sequence"
                      - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                        timeout: 5
                        continue_on_timeout: false
                      - variables:
                          _sequence_changed: true

                  # Disable self_clean BEFORE start (prevent auto-return to station)
                  - if: "{{ has_value(self_clean_switch) and _old_self_clean }}"
                    then:
                      - action: switch.turn_off
                        target:
                          entity_id: "{{ self_clean_switch }}"
                      - variables:
                          _self_clean_changed: true

                  # Start cleaning
                  - variables:
                      _use_segments: "{{ use_segment_service and has_segments }}"
                  - if: "{{ _use_segments }}"
                    then:
                      - action: dreame_vacuum.vacuum_clean_segment
                        continue_on_error: true
                        target:
                          entity_id: "{{ vacuum_entity }}"
                        data:
                          segments: "{{ map_segments }}"
                          repeats: "{{ repeats }}"
                    else:
                      - action: vacuum.start
                        continue_on_error: true
                        target:
                          entity_id: "{{ vacuum_entity }}"

                  # Wait for robot to start cleaning.
                  #
                  # NEVER narrow this per cleaning mode. mopping_after_sweeping reports
                  # 'sweeping' first (sweep pass) and only later 'mopping' - it never
                  # reports 'sweeping_and_mopping'. The previous per-mode list missed
                  # that, and with continue_on_timeout: false a missed match aborted the
                  # run BEFORE the delay and vacuum.pause below - leaving the robot
                  # driving around an upper floor with nobody coming to carry it.
                  #
                  # continue_on_timeout is true on purpose: the pause IS the safety
                  # action, so a failed detection must not skip it. vacuum.pause on a
                  # robot that never started is harmless and already tolerant of errors.
                  - wait_template: >
                      {{ states('sensor.' ~ vacuum_base_name ~ '_state') in start_detect_states }}
                    timeout: 30
                    continue_on_timeout: true
                  - variables:
                      _start_detected: "{{ wait.completed }}"

                  # Delay to allow robot to move away from station
                  - delay:
                      seconds: "{{ pause_delay_after_undock }}"

                  # Pause for manual transport
                  - action: vacuum.pause
                    continue_on_error: true
                    target:
                      entity_id: "{{ vacuum_entity }}"

                  # Summary notification (Level 1+)
                  - if: "{{ debug_info }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "🚀 Start Complete"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            {% if _stopped_drying %}├─ ✔ **Stop Drying:** idle
                            {% endif %}{% if _is_mop_mode %}├─ ✔ **Wash & Refill:** {{ _wash_duration }}s
                            {% endif %}{% if has_customized_cleaning %}├─ ✔ **Customized:** {% if _customized_changed %}off → **on**{% else %}{{ 'on' if is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') else 'off' }}{% endif %}
                            {% endif %}{% if has_cleaning_sequence %}├─ ✔ **Sequence:** {% if _sequence_changed %}off → **on**{% else %}{{ 'on' if is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') else 'off' }}{% endif %}
                            {% endif %}{% if has_value(self_clean_switch) %}├─ ✔ **Self-Clean:** {% if _self_clean_changed %}on → **off**{% else %}off{% endif %}
                            {% endif %}├─ {% if _start_detected %}✔{% else %}⚠️{% endif %} **Start:** {{ states('sensor.' ~ vacuum_base_name ~ '_state') }}{% if not _start_detected %} (not detected within 30s){% endif %}
                            ├─ ✔ **Delay:** {{ pause_delay_after_undock }}s
                            └─ ✔ **Pause:** paused

                            **Map:** {{ current_map_name }}
                            **Cleaning-Mode:** {{ current_mode | replace('_', ' ') | title }}
                            **Duration:** {{ ((now().timestamp() - _fn_start) | round(1)) }}s

      # ========================================
      # FUNCTION 4: Map 1 Switch (fn_map1)
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_map1' }}"
        sequence:
          # Busy check - ignore trigger if robot is busy
          - if: "{{ is_busy }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** fn_map1
                    **Status:** {{ current_base_status if current_base_status == 'washing' else current_status }}

                    ❌ Automation aborted
              - stop: "Robot busy"

          # Track old values
          - variables:
              _old_map: "{{ states(selected_map_select) | default('unknown') }}"
              _had_temp_map: "{{ auto_discard_temp_map and has_temporary_map }}"

          # Discard temporary map if exists and auto-discard enabled
          - if: "{{ _had_temp_map }}"
            then:
              - action: dreame_vacuum.vacuum_discard_temporary_map
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
              - delay:
                  seconds: 2

          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ selected_map_select }}"
            data:
              option: "{{ map_1_name }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🗺️ {{ map_1_name }}"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    {% if _had_temp_map %}├─ ✔ **Discard Temp:** yes
                    └─ ✔ **Map:** {{ _old_map }} → **{{ map_1_name }}**{% else %}└─ ✔ **Map:** {{ _old_map }} → **{{ map_1_name }}**{% endif %}

      # ========================================
      # FUNCTION 5: Map 2 Switch (fn_map2)
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_map2' }}"
        sequence:
          # Busy check - ignore trigger if robot is busy
          - if: "{{ is_busy }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** fn_map2
                    **Status:** {{ current_base_status if current_base_status == 'washing' else current_status }}

                    ❌ Automation aborted
              - stop: "Robot busy"

          # Track old values
          - variables:
              _old_map: "{{ states(selected_map_select) | default('unknown') }}"
              _had_temp_map: "{{ auto_discard_temp_map and has_temporary_map }}"

          # Discard temporary map if exists and auto-discard enabled
          - if: "{{ _had_temp_map }}"
            then:
              - action: dreame_vacuum.vacuum_discard_temporary_map
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
              - delay:
                  seconds: 2

          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ selected_map_select }}"
            data:
              option: "{{ map_2_name }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🗺️ {{ map_2_name }}"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    {% if _had_temp_map %}├─ ✔ **Discard Temp:** yes
                    └─ ✔ **Map:** {{ _old_map }} → **{{ map_2_name }}**{% else %}└─ ✔ **Map:** {{ _old_map }} → **{{ map_2_name }}**{% endif %}

      # ========================================
      # FUNCTION 6: Map 3 Switch (fn_map3)
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_map3' }}"
        sequence:
          # Busy check - ignore trigger if robot is busy
          - if: "{{ is_busy }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** fn_map3
                    **Status:** {{ current_base_status if current_base_status == 'washing' else current_status }}

                    ❌ Automation aborted
              - stop: "Robot busy"

          # Track old values
          - variables:
              _old_map: "{{ states(selected_map_select) | default('unknown') }}"
              _had_temp_map: "{{ auto_discard_temp_map and has_temporary_map }}"

          # Discard temporary map if exists and auto-discard enabled
          - if: "{{ _had_temp_map }}"
            then:
              - action: dreame_vacuum.vacuum_discard_temporary_map
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
              - delay:
                  seconds: 2

          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ selected_map_select }}"
            data:
              option: "{{ map_3_name }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🗺️ {{ map_3_name }}"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    {% if _had_temp_map %}├─ ✔ **Discard Temp:** yes
                    └─ ✔ **Map:** {{ _old_map }} → **{{ map_3_name }}**{% else %}└─ ✔ **Map:** {{ _old_map }} → **{{ map_3_name }}**{% endif %}

      # ========================================
      # FUNCTION 7: Map 4 Switch (fn_map4)
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_map4' }}"
        sequence:
          # Busy check - ignore trigger if robot is busy
          - if: "{{ is_busy }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** fn_map4
                    **Status:** {{ current_base_status if current_base_status == 'washing' else current_status }}

                    ❌ Automation aborted
              - stop: "Robot busy"

          # Track old values
          - variables:
              _old_map: "{{ states(selected_map_select) | default('unknown') }}"
              _had_temp_map: "{{ auto_discard_temp_map and has_temporary_map }}"

          # Discard temporary map if exists and auto-discard enabled
          - if: "{{ _had_temp_map }}"
            then:
              - action: dreame_vacuum.vacuum_discard_temporary_map
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
              - delay:
                  seconds: 2

          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ selected_map_select }}"
            data:
              option: "{{ map_4_name }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🗺️ {{ map_4_name }}"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    {% if _had_temp_map %}├─ ✔ **Discard Temp:** yes
                    └─ ✔ **Map:** {{ _old_map }} → **{{ map_4_name }}**{% else %}└─ ✔ **Map:** {{ _old_map }} → **{{ map_4_name }}**{% endif %}

      # ========================================
      # FUNCTION 8: Single Room Cleaning (fn_room)
      # ========================================
      # Cleans exactly ONE room, selected by (map, room) in the trigger event.
      #
      # Everything is committed to the robot inside THIS run: map switched, mode set,
      # vacuum_clean_segment issued. On a map without the base station the robot is
      # then paused MID-JOB, so notification_start only has to call vacuum.start to
      # resume that in-flight job. No helper entity, no state across runs, and no
      # change to notification_start / notification_cancel.
      - conditions:
          - condition: template
            value_template: "{{ triggered_function == 'fn_room' }}"
        sequence:
          # ---------- GUARDS ----------
          - if: "{{ is_busy }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "dreame_room_busy_{{ vacuum_base_name }}"
                  title: "⏳ Busy"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    **Function:** Single Room
                    **Status:** {{ current_base_status if current_base_status == 'washing' else current_status }}

                    ❌ Automation aborted
              - stop: "Robot busy"

          - if: "{{ not is_docked }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "dreame_room_error_{{ vacuum_base_name }}"
                  title: "⚠️ Room Cleaning Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Dock:** not docked ({{ states(vacuum_entity) }})
                    └─ ○ **Start:** skipped

                    ❌ Automation aborted
              - stop: "Robot not docked"
                error: true

          - if: "{{ room_target_map_name in ['', 'unavailable', 'unknown'] }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "dreame_room_error_{{ vacuum_base_name }}"
                  title: "⚠️ Room Cleaning Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Map:** slot `{{ room_target_map_num }}` unavailable
                    └─ ○ **Expected:** `map` in the event data, 1-4

                    ❌ Automation aborted
              - stop: "Target map unavailable"
                error: true

          - if: "{{ not room_target_room_valid }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "dreame_room_error_{{ vacuum_base_name }}"
                  title: "⚠️ Room Cleaning Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ✔ **Map:** {{ room_target_map_name }}
                    ├─ ⚠️ **Room:** `{{ room_target_room_id }}` not on this map
                    └─ ○ **Available:** {{ room_target_room_ids | join(', ') }}

                    ❌ Automation aborted
              - stop: "Unknown room id for target map"
                error: true

          - if: "{{ room_target_is_mop and not mop_ready }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "mop_not_ready_{{ vacuum_base_name }}"
                  title: "{{ mop_not_ready_title }}"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Mop Pad:** {{ mop_pad_status }}
                    └─ ⚠️ **Water:** {{ water_warning_status }}

                    ❌ Automation aborted
              - stop: "Mop not ready"
                error: true

          # ---------- SNAPSHOT ----------
          - variables:
              _fn_start: "{{ now().timestamp() }}"
              _target_has_base: "{{ room_target_map_name == base_station_map }}"
              _old_map: "{{ states(selected_map_select) | default('unknown') }}"
              _old_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"

          # ---------- DISCARD TEMPORARY MAP ----------
          - if: "{{ auto_discard_temp_map and has_temporary_map }}"
            then:
              - action: dreame_vacuum.vacuum_discard_temporary_map
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
              - delay:
                  seconds: 2

          # ---------- SWITCH MAP ----------
          # Selecting a map ends any active job, which is why the dock guard runs first.
          - if: "{{ _old_map != room_target_map_name }}"
            then:
              - action: select.select_option
                continue_on_error: true
                target:
                  entity_id: "{{ selected_map_select }}"
                data:
                  option: "{{ room_target_map_name }}"
              - wait_template: "{{ states(selected_map_select) == room_target_map_name }}"
                timeout: 30
                continue_on_timeout: false
              # Let the map finish loading before reading its rooms
              - delay:
                  seconds: 5

          # ---------- RE-VALIDATE AGAINST THE LIVE MAP ----------
          # room_target_room_ids came from the slot camera, which can lag behind the
          # robot. Confirm the room really exists on the map that is now loaded.
          - variables:
              _live_room_ids: >
                {% set rooms = state_attr(map_camera, 'rooms') %}
                {{ rooms.values() | map(attribute='room_id', default=-1) | list if rooms is mapping else [] }}
          - if: "{{ _live_room_ids | length > 0 and room_target_room_id not in _live_room_ids }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "dreame_room_error_{{ vacuum_base_name }}"
                  title: "⚠️ Room Cleaning Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ✔ **Map:** {{ room_target_map_name }}
                    ├─ ⚠️ **Room:** `{{ room_target_room_id }}` missing after map switch
                    └─ ○ **On loaded map:** {{ _live_room_ids | join(', ') }}

                    ❌ Automation aborted
              - stop: "Room not present on target map after switch"
                error: true

          # ---------- CLEANING MODE ----------
          # customized_cleaning off so the global mode and our repeats actually apply
          - if: "{{ _old_customized }}"
            then:
              - action: switch.turn_off
                continue_on_error: true
                target:
                  entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"
              - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'off') }}"
                timeout: 10
                continue_on_timeout: true

          # The cleaning_mode select is unavailable while cleaning; we are docked, but
          # it can still be briefly unavailable right after a map switch.
          - wait_template: "{{ has_value(cleaning_mode_select) }}"
            timeout: 5
            continue_on_timeout: true
          - action: select.select_option
            enabled: "{{ room_target_mode | default('') != '' }}"
            continue_on_error: true
            target:
              entity_id: "{{ cleaning_mode_select }}"
            data:
              option: "{{ room_target_mode }}"
          - wait_template: "{{ states(cleaning_mode_select) == room_target_mode }}"
            timeout: 10
            continue_on_timeout: true

          - choose:
              # ============================================================
              # TARGET MAP HAS THE BASE STATION → clean right away
              # ============================================================
              - conditions:
                  - condition: template
                    value_template: "{{ _target_has_base }}"
                sequence:
                  # self_clean on: the robot may use the dock freely on this floor
                  - if: "{{ has_value(self_clean_switch) and is_state(self_clean_switch, 'off') }}"
                    then:
                      - action: switch.turn_on
                        continue_on_error: true
                        target:
                          entity_id: "{{ self_clean_switch }}"

                  - action: dreame_vacuum.vacuum_clean_segment
                    continue_on_error: true
                    target:
                      entity_id: "{{ vacuum_entity }}"
                    data:
                      segments: "{{ [room_target_room_id] }}"
                      repeats: "{{ room_target_repeats }}"

                  - if: "{{ debug_info }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "🚪 Room Cleaning Started"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            ├─ ✔ **Map:** {% if _old_map != room_target_map_name %}{{ _old_map }} → **{{ room_target_map_name }}**{% else %}{{ room_target_map_name }}{% endif %}

                            ├─ ✔ **Room:** {{ room_target_room_name }} (#{{ room_target_room_id }})
                            ├─ ✔ **Cleaning-Mode:** {{ states(cleaning_mode_select) }}
                            ├─ ✔ **Repeats:** {{ room_target_repeats }}
                            └─ ✔ **Start:** base station map, no transport needed

                            **Active Segments:** {{ state_attr(vacuum_entity, 'active_segments') }}
                            **Duration:** {{ ((now().timestamp() - _fn_start) | round(1)) }}s

            # ============================================================
            # TARGET MAP WITHOUT BASE STATION → prepare, pause, carry
            # Mirrors the fn_start non-base-map preparation procedure.
            # ============================================================
            default:
              # Captured at THIS scope on purpose: `- variables:` inside a `then:` block
              # only shadows within that block, so anything assigned in there would be
              # invisible to the summary further down.
              - variables:
                  _stopped_drying: "{{ room_target_is_mop and states(self_wash_base_status_sensor) == 'drying' }}"
                  _wash_start: "{{ now().timestamp() }}"

              - if: "{{ room_target_is_mop }}"
                then:
                  # Stop an active drying cycle first
                  - if: "{{ _stopped_drying }}"
                    then:
                      - action: button.press
                        continue_on_error: true
                        target:
                          entity_id: "{{ stop_drying_button }}"
                      - wait_template: "{{ states(self_wash_base_status_sensor) != 'drying' }}"
                        timeout: 10
                        continue_on_timeout: true

                  # Wash and moisten the mop before leaving the dock
                  - action: button.press
                    continue_on_error: true
                    target:
                      entity_id: "{{ self_clean_button }}"
                  - wait_template: "{{ states(self_wash_base_status_sensor) in ['washing', 'clean_add_water'] }}"
                    timeout:
                      seconds: "{{ mop_start_timeout }}"
                    continue_on_timeout: true
                  - wait_template: "{{ states(self_wash_base_status_sensor) not in ['washing', 'clean_add_water'] }}"
                    timeout:
                      seconds: "{{ moistening_timeout }}"
                    continue_on_timeout: true

              - variables:
                  _wash_duration: "{{ (now().timestamp() - _wash_start) | round(0) | int if room_target_is_mop else 0 }}"

              # delay=0 keeps the robot docked - map, mode and mop are already staged
              - if: "{{ pause_delay_after_undock == 0 }}"
                then:
                  - if: "{{ debug_info }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "⏭️ Room Cleaning Staged (delay=0)"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            └─ ✔ **Status:** docked — {{ room_target_map_name }} / {{ room_target_room_name }}
                  - stop: "Delay is 0, robot stays docked"

              # self_clean off BEFORE starting: on a floor without a dock the robot
              # would otherwise drive off looking for one it cannot reach.
              - if: "{{ has_value(self_clean_switch) and is_state(self_clean_switch, 'on') }}"
                then:
                  - action: switch.turn_off
                    continue_on_error: true
                    target:
                      entity_id: "{{ self_clean_switch }}"

              - action: dreame_vacuum.vacuum_clean_segment
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
                data:
                  segments: "{{ [room_target_room_id] }}"
                  repeats: "{{ room_target_repeats }}"

              # See fn_start: never narrow per mode, never abort on timeout - the
              # pause below is the safety action.
              - wait_template: >
                  {{ states('sensor.' ~ vacuum_base_name ~ '_state') in start_detect_states }}
                timeout:
                  seconds: "{{ mop_start_timeout if room_target_is_mop else 30 }}"
                continue_on_timeout: true
              - variables:
                  _start_detected: "{{ wait.completed }}"

              # Let the robot clear the dock, then pause for manual transport
              - delay:
                  seconds: "{{ pause_delay_after_undock }}"
              - action: vacuum.pause
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"

              # Pickup notification - reuses the existing START_CLEANING /
              # CANCEL_CLEANING action ids, so notification_start and
              # notification_cancel handle the resume unchanged.
              - if: "{{ notification_enabled }}"
                then:
                  - variables:
                      map_name: "{{ room_target_map_name }}"
                      room_name: "{{ room_target_room_name }}"
                      current_map: "{{ states(selected_map_select) }}"
                      cleaning_mode_display: "{{ sweep_mop_display if room_target_is_mop else sweep_display }}"
                      # NOTE: Notification service builder pattern (duplicated in
                      # scheduled_notify_services and pickup_notify_services)
                      # REASON: Jinja2 in HA blueprints doesn't support macros/functions
                      # If modifying this logic, update the other two as well
                      room_notify_services: >
                        {% set result = [] %}
                        {% for person in notification_persons %}
                          {% if is_state(person, 'home') %}
                            {% set trackers = state_attr(person, 'device_trackers') %}
                            {% if trackers %}
                              {% set first_tracker = trackers if trackers is string_like else (trackers | first) %}
                              {% set tracker_name = first_tracker | replace('device_tracker.', '') %}
                              {% if tracker_name | length > 0 %}
                                {% set result = result + ['notify.mobile_app_' + tracker_name] %}
                              {% endif %}
                            {% endif %}
                          {% endif %}
                        {% endfor %}
                        {% for group in notification_groups %}
                          {% if group and group not in ['', 'unknown', 'unavailable', none] %}
                            {% set result = result + ['notify.' + group] %}
                          {% endif %}
                        {% endfor %}
                        {{ result }}
                  - repeat:
                      for_each: "{{ room_notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: !input pickup_notification_title
                            message: !input pickup_notification_message
                            data:
                              actions:
                                - action: "START_CLEANING"
                                  title: "{{ start_cleaning_button }}"
                                - action: "CANCEL_CLEANING"
                                  title: "{{ cancel_cleaning_button }}"
                              push:
                                interruption-level: "{{ notification_interruption_level }}"
                                sound: >
                                  {% if notification_critical %}
                                    {{ {'name': notification_sound, 'critical': 1, 'volume': notification_volume} }}
                                  {% else %}
                                    {{ notification_sound }}
                                  {% endif %}

              - if: "{{ debug_info }}"
                then:
                  - action: persistent_notification.create
                    data:
                      title: "🚪 Room Cleaning Prepared"
                      message: |
                        {{ now().strftime('%H:%M:%S') }}

                        ├─ ✔ **Map:** {% if _old_map != room_target_map_name %}{{ _old_map }} → **{{ room_target_map_name }}**{% else %}{{ room_target_map_name }}{% endif %}

                        ├─ ✔ **Room:** {{ room_target_room_name }} (#{{ room_target_room_id }})
                        ├─ ✔ **Cleaning-Mode:** {{ states(cleaning_mode_select) }}
                        {% if _stopped_drying %}├─ ✔ **Stop Drying:** idle
                        {% endif %}{% if room_target_is_mop %}├─ ✔ **Wash & Refill:** {{ _wash_duration }}s
                        {% endif %}├─ {% if _start_detected %}✔{% else %}⚠️{% endif %} **Start:** {{ states('sensor.' ~ vacuum_base_name ~ '_state') }}{% if not _start_detected %} (not detected){% endif %}

                        ├─ ✔ **Pause:** for transport
                        └─ ✔ **Notify:** {{ 'sent' if notification_enabled else 'disabled' }}

                        **Active Segments:** {{ state_attr(vacuum_entity, 'active_segments') }}
                        **Duration:** {{ ((now().timestamp() - _fn_start) | round(1)) }}s

      # ========================================
      # SCHEDULE-TRIGGERED CLEANING FUNCTIONS
      # ========================================
      # These functions are triggered by schedule entities (state: "on")
      # Workflow:
      # 1. Conflict check (abort if already cleaning)
      # 2. If map has base station → Start cleaning immediately
      # 3. If map WITHOUT base station → Send notification, wait for user action

      # ========================================
      # UNIFIED SCHEDULE HANDLER (Maps 1-3, Sweep/Mop)
      # ========================================
      - conditions: "{{ trigger.id.startswith('schedule_map') }}"
        sequence:
          # Dynamic variable extraction from trigger.id
          - variables:
              _map_num: >
                {% if 'map1' in trigger.id %}1
                {% elif 'map2' in trigger.id %}2
                {% elif 'map3' in trigger.id %}3
                {% else %}4{% endif %}
              _is_mop: "{{ 'mop' in trigger.id and 'fallback' not in trigger.id }}"
              target_mode: "{{ mode_sweeping_mopping if _is_mop else mode_sweeping }}"
              target_map_name: "{{ [map_1_name, map_2_name, map_3_name, map_4_name][_map_num - 1] }}"
              target_map_config: "{{ map_config['map_' ~ _map_num] }}"
              schedule_label: "Map {{ _map_num }} {{ 'Mop' if _is_mop else 'Sweep' }}"
              prepare_action_id: "PREPARE_MAP{{ _map_num }}_{{ 'MOP' if _is_mop else 'SWEEP' }}"
              # Check if this schedule is enabled
              _schedule_entity: >
                {% set entities = {
                  'schedule_map1_sweep': map_1_sweep_schedule_entity,
                  'schedule_map1_mop': map_1_mop_schedule_entity,
                  'schedule_map2_sweep': map_2_sweep_schedule_entity,
                  'schedule_map2_mop': map_2_mop_schedule_entity,
                  'schedule_map3_sweep': map_3_sweep_schedule_entity,
                  'schedule_map3_mop': map_3_mop_schedule_entity,
                  'schedule_map4_sweep': map_4_sweep_schedule_entity,
                  'schedule_map4_mop': map_4_mop_schedule_entity
                } %}
                {{ entities.get(trigger.id, 'none') }}

          # ========================================
          # CHECK 1: ERROR STATE (ALWAYS FIRST!)
          # ========================================
          - if: >
              {{ states(error_entity) not in ['no_error', 'unknown', 'unavailable', 'none'] }}
            then:
              # Error notifications always show (regardless of debug level)
              - action: persistent_notification.create
                data:
                  title: "⚠️ Schedule Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Error:** {{ error_message }}
                    └─ ○ Start

                    ❌ Automation aborted
                    **Schedule:** {{ schedule_label }}
                  notification_id: "schedule_error_{{ vacuum_base_name }}"
              - stop: "Schedule aborted: Robot error {{ error_message }}"
                error: true

          # CHECK 2: Skip if schedule entity is unset ("none", [] or empty)
          - if: "{{ not _schedule_entity or _schedule_entity in ['none', '[]'] }}"
            then:
              - stop: "Schedule not configured"

          # CHECK 3: Conflict check
          - if: "{{ schedule_conflict_detected }}"
            then:
              - if: "{{ debug_info }}"
                then:
                  - action: persistent_notification.create
                    data:
                      title: "⏳ Schedule Conflict"
                      message: |
                        {{ now().strftime('%H:%M:%S') }}

                        **Schedule:** {{ schedule_label }}

                        ❌ Automation aborted
              - stop: "Schedule conflict"
                error: true

          # Dock check
          - if: "{{ not is_docked }}"
            then:
              # Error notifications always show
              - action: persistent_notification.create
                data:
                  title: "⚠️ Schedule Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Dock:** not docked
                    └─ ○ Start

                    ❌ Automation aborted
                    **Schedule:** {{ schedule_label }}
                  notification_id: "schedule_dock_error_{{ vacuum_base_name }}"
              - stop: "Robot not docked, cannot start scheduled cleaning"
                error: true

          # Base station map → Prepare and start immediately
          - if: "{{ target_map_config.has_base_station }}"
            then:
              # Track old values for summary
              - variables:
                  _fn_start: "{{ now().timestamp() }}"
                  _old_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
                  _old_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"
                  _old_sequence: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                  _old_map: "{{ states(selected_map_select) | default('unknown') }}"

              # Disable customized_cleaning if active
              - if: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
                then:
                  - action: switch.turn_off
                    continue_on_error: true
                    target:
                      entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"
                  - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'off') }}"
                    timeout: 10
                    continue_on_timeout: false

              # Check cleaning_mode_select availability (hardware-dependent)
              - wait_template: "{{ has_value(cleaning_mode_select) }}"
                timeout: 2 # Shorter timeout (not waiting for state change)
                continue_on_timeout: true # Continue even if unavailable

              # Enable cleaning_sequence if available
              - if: "{{ has_cleaning_sequence and is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'off') }}"
                then:
                  - action: switch.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "switch.{{ vacuum_base_name }}_cleaning_sequence"
                  - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                    timeout: 5
                    continue_on_timeout: true

              # Set mode
              - action: select.select_option
                enabled: "{{ target_mode | default('') != '' }}"
                continue_on_error: true
                target:
                  entity_id: "{{ cleaning_mode_select }}"
                data:
                  option: "{{ target_mode }}"

              # Discard temporary map if exists and auto-discard enabled
              - if: "{{ auto_discard_temp_map and has_temporary_map }}"
                then:
                  - action: dreame_vacuum.vacuum_discard_temporary_map
                    continue_on_error: true
                    target:
                      entity_id: "{{ vacuum_entity }}"
                  - delay:
                      seconds: 2

              # Switch map
              - action: select.select_option
                enabled: "{{ target_map_name | default('') != '' }}"
                continue_on_error: true
                target:
                  entity_id: "{{ selected_map_select }}"
                data:
                  option: "{{ target_map_name }}"

              # Verify map switch
              - wait_template: "{{ states(selected_map_select) == target_map_name }}"
                timeout: 30
                continue_on_timeout: false

              # Start cleaning
              - if: "{{ use_segment_service and has_segments }}"
                then:
                  - action: dreame_vacuum.vacuum_clean_segment
                    continue_on_error: true
                    target:
                      entity_id: "{{ vacuum_entity }}"
                    data:
                      segments: "{{ map_segments }}"
                      repeats: "{{ target_map_config.cleaning_repeats }}"
                else:
                  - action: vacuum.start
                    continue_on_error: true
                    target:
                      entity_id: "{{ vacuum_entity }}"

              # Track new values for summary
              - variables:
                  _new_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
                  _new_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"
                  _new_sequence: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                  _customized_changed: "{{ _old_customized != _new_customized }}"
                  _mode_changed: "{{ _old_mode != _new_mode }}"
                  _sequence_changed: "{{ _old_sequence != _new_sequence }}"
                  _map_changed: "{{ _old_map != target_map_name }}"

              # Summary notification (Level 1+)
              - if: "{{ debug_info }}"
                then:
                  - action: persistent_notification.create
                    data:
                      title: "📅 Schedule Complete"
                      message: |
                        {{ now().strftime('%H:%M:%S') }}

                        {% if has_customized_cleaning %}├─ ✔ **Customized:** {% if _customized_changed %}on → **off**{% else %}off{% endif %}
                        {% endif %}{% if has_cleaning_sequence %}├─ ✔ **Sequence:** {% if _sequence_changed %}off → **on**{% else %}on{% endif %}
                        {% endif %}├─ ✔ **Cleaning-Mode:** {% if _mode_changed %}{{ _old_mode }} → **{{ _new_mode }}**{% else %}{{ _new_mode }}{% endif %}
                        ├─ ✔ **Map:** {% if _map_changed %}{{ _old_map }} → **{{ target_map_name }}**{% else %}{{ target_map_name }}{% endif %}
                        └─ ✔ **Start:** {{ 'segments' if use_segment_service and has_segments else 'vacuum.start' }}

                        **Schedule:** {{ schedule_label }}
                        **Duration:** {{ ((now().timestamp() - _fn_start) | round(1)) }}s

            # Non-base station → Send notification immediately
            else:
              # Check if notifications enabled
              - if: "{{ not notification_enabled }}"
                then:
                  # Error notifications always show
                  - action: persistent_notification.create
                    data:
                      title: "⚠️ Schedule Failed"
                      message: |
                        {{ now().strftime('%H:%M:%S') }}

                        ├─ ⚠️ **Config:** notifications disabled
                        └─ ○ Notify

                        ❌ Automation aborted
                        **Schedule:** {{ schedule_label }} (no base station)
                      notification_id: "schedule_config_error_{{ vacuum_base_name }}"
                  - stop: "Scheduled notification required but disabled"
                    error: true

              # Build notification service list
              - variables:
                  map_name: "{{ target_map_name }}"
                  schedule_name: "{{ schedule_label }}"
                  cleaning_mode_display: >
                    {% if target_mode == mode_sweeping %}{{ sweep_display | default('Sweep') }}
                    {% elif target_mode in mop_modes %}{{ sweep_mop_display | default('Sweep+Mop') }}
                    {% else %}{{ target_mode }}{% endif %}
                  # NOTE: Notification service builder pattern (duplicated in pickup_notify_services)
                  # REASON: Jinja2 in HA blueprints doesn't support macros/functions
                  # If modifying this logic, update pickup_notify_services as well
                  scheduled_notify_services: >
                    {% set ns = namespace(result=[]) %}
                    {% for person in notification_persons %}
                      {% if is_state(person, 'home') %}
                        {% set trackers = state_attr(person, 'device_trackers') %}
                        {% if trackers %}
                          {% set first_tracker = trackers if trackers is string_like else (trackers | first) %}
                          {% set tracker_name = first_tracker | replace('device_tracker.', '') %}
                          {% if tracker_name | length > 0 %}
                            {% set ns.result = ns.result + ['notify.mobile_app_' + tracker_name] %}
                          {% endif %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                    {% for group in notification_groups %}
                      {% if group and group not in ['', 'unknown', 'unavailable', none] %}
                        {% set ns.result = ns.result + ['notify.' + group] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.result }}
                  sweep_fallback_action_id: "PREPARE_MAP{{ _map_num }}_SWEEP_FALLBACK"

              # Check if any notification recipients available
              - if: "{{ scheduled_notify_services | length == 0 }}"
                then:
                  # Error notifications always show
                  - action: persistent_notification.create
                    data:
                      title: "⚠️ Schedule Failed"
                      message: |
                        {{ now().strftime('%H:%M:%S') }}

                        ├─ ⚠️ **Recipients:** none available
                        └─ ○ Notify

                        ❌ Automation aborted
                        **Schedule:** {{ schedule_label }}
                      notification_id: "schedule_no_recipients_{{ vacuum_base_name }}"
                  - stop: "No notification recipients available"
                    error: true

              # Check mop readiness for mop mode
              - if: "{{ target_mode in mop_modes and not mop_ready }}"
                then:
                  # Send warning notification with sweep-only fallback option
                  - repeat:
                      for_each: "{{ scheduled_notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "{{ mop_not_ready_title }}"
                            message: "{{ mop_not_ready_message }}"
                            data:
                              actions:
                                - action: "{{ sweep_fallback_action_id }}"
                                  title: "{{ sweep_only_button }}"
                                - action: "SKIP_CLEANING"
                                  title: "{{ skip_button }}"
                              push:
                                interruption-level: "{{ notification_interruption_level }}"

                  # Warning notification (Level 1+)
                  - if: "{{ debug_info }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "⚠️ Mop Not Ready"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            ├─ ⚠️ **Mop Pad:** {{ mop_pad_status }}
                            └─ ⚠️ **Water:** {{ water_warning_status }}

                            **Schedule:** {{ schedule_label }}

                else:
                  # Normal notification flow
                  - repeat:
                      for_each: "{{ scheduled_notify_services }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: !input scheduled_notification_title
                            message: !input scheduled_notification_message
                            data:
                              actions:
                                - action: "{{ prepare_action_id }}"
                                  title: "{{ prepare_button }}"
                                - action: "SKIP_CLEANING"
                                  title: "{{ skip_button }}"
                              push:
                                interruption-level: "{{ notification_interruption_level }}"
                                sound: >
                                  {% if notification_critical %}
                                    {{ {'name': notification_sound, 'critical': 1, 'volume': notification_volume} }}
                                  {% else %}
                                    {{ notification_sound }}
                                  {% endif %}

                  # Summary notification (Level 1+)
                  - if: "{{ debug_info }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "📅 Schedule Notify"
                          message: |
                            {{ now().strftime('%H:%M:%S') }}

                            └─ ✔ **Notify:** sent

                            **Schedule:** {{ schedule_label }}

              # Stop after notification (success, not error)
              - stop: "Scheduled notification sent, awaiting user action"
                error: false

      # ========================================
      # NOTIFICATION ACTION HANDLERS
      # ========================================
      # These handle user responses from notification action buttons

      # ========================================
      # UNIFIED PREPARE HANDLER (Maps 1-3, Sweep/Mop)
      # ========================================
      - conditions: "{{ trigger.id.startswith('notification_prepare_map') }}"
        sequence:
          # Dynamic variable extraction from trigger.id
          - variables:
              _map_num: >
                {% if 'map1' in trigger.id %}1
                {% elif 'map2' in trigger.id %}2
                {% elif 'map3' in trigger.id %}3
                {% else %}4{% endif %}
              _is_mop: "{{ 'mop' in trigger.id and 'fallback' not in trigger.id }}"
              notification_target_mode: "{{ mode_sweeping_mopping if _is_mop else mode_sweeping }}"
              notification_target_map_name: "{{ [map_1_name, map_2_name, map_3_name, map_4_name][_map_num - 1] }}"
              notification_cleaning_repeats: "{{ map_config['map_' ~ _map_num].cleaning_repeats }}"
              schedule_label: "Map {{ _map_num }} {{ 'Mop' if _is_mop else 'Sweep' }}"

          # ========================================
          # CHECK 1: ERROR STATE (ALWAYS FIRST!)
          # ========================================
          - if: >
              {{ states(error_entity) not in ['no_error', 'unknown', 'unavailable', 'none'] }}
            then:
              # Error notifications always show
              - action: persistent_notification.create
                data:
                  title: "⚠️ Prepare Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Error:** {{ error_message }}
                    ├─ ○ Map
                    ├─ ○ Mode
                    ├─ ○ Start
                    └─ ○ Pause

                    ❌ Automation aborted
                    **Schedule:** {{ schedule_label }}
                  notification_id: "prepare_error_{{ vacuum_base_name }}"
              - stop: "Cannot prepare: Robot error {{ error_message }}"
                error: true

          # CHECK 2: Dock check
          - if: "{{ not is_docked }}"
            then:
              # Error notifications always show
              - action: persistent_notification.create
                data:
                  title: "⚠️ Prepare Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Dock:** not docked
                    ├─ ○ Map
                    ├─ ○ Mode
                    ├─ ○ Start
                    └─ ○ Pause

                    ❌ Automation aborted
                    **Schedule:** {{ schedule_label }}
                  notification_id: "prepare_dock_error_{{ vacuum_base_name }}"
              - stop: "Robot not docked, cannot start preparation"
                error: true

          # Mop readiness check (only for mop mode, skip for fallback)
          - if: "{{ _is_mop and not mop_ready }}"
            then:
              # Error notifications always show
              - action: persistent_notification.create
                data:
                  title: "⚠️ Prepare Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Mop Pad:** {{ mop_pad_status }}
                    ├─ ⚠️ **Water:** {{ water_warning_status }}
                    ├─ ○ Map
                    ├─ ○ Mode
                    ├─ ○ Start
                    └─ ○ Pause

                    ❌ Automation aborted
                    **Schedule:** {{ schedule_label }}
                  notification_id: "mop_not_ready_{{ vacuum_base_name }}"
              - stop: "Mop not ready - pad not installed or water empty"
                error: true

          # Track start time and old values for summary
          - variables:
              _fn_start: "{{ now().timestamp() }}"
              _old_map: "{{ states(selected_map_select) | default('unknown') }}"
              _old_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"
              _old_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
              _old_sequence: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
              _old_self_clean: "{{ is_state('switch.' ~ vacuum_base_name ~ '_self_clean', 'on') }}"

          # SAFETY CHECKS (before any actions)
          - if: "{{ states('sensor.' ~ vacuum_base_name ~ '_status') not in ['idle', 'docked', 'charging', 'sleeping'] }}"
            then:
              # Error notifications always show
              - action: persistent_notification.create
                data:
                  title: "⚠️ Prepare Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Status:** {{ states('sensor.' ~ vacuum_base_name ~ '_status') }}
                    ├─ ○ Map
                    ├─ ○ Mode
                    ├─ ○ Start
                    └─ ○ Pause

                    ❌ Automation aborted
                    **Schedule:** {{ schedule_label }}
                  notification_id: "prepare_busy_error_{{ vacuum_base_name }}"
              - stop: "Robot busy, cannot switch map"
                error: true

          - if: "{{ notification_target_map_name == '' or notification_target_map_name == 'unavailable' }}"
            then:
              # Error notifications always show
              - action: persistent_notification.create
                data:
                  title: "⚠️ Prepare Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Map:** unavailable ({{ _map_num }})
                    ├─ ○ Mode
                    ├─ ○ Start
                    └─ ○ Pause

                    ❌ Automation aborted
                    **Schedule:** {{ schedule_label }}
                  notification_id: "prepare_map_error_{{ vacuum_base_name }}"
              - stop: "Target map unavailable"
                error: true

          # MAP SWITCH FIRST (before all other actions!)
          - action: select.select_option
            target:
              entity_id: "{{ selected_map_select }}"
            data:
              option: "{{ notification_target_map_name }}"

          - wait_template: "{{ states(selected_map_select) == notification_target_map_name }}"
            timeout: 30
            continue_on_timeout: false

          # 5-second delay for map loading
          - delay:
              seconds: 5

          # Step 1: Disable customized_cleaning
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"
          - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'off') }}"
            timeout: 10
            continue_on_timeout: false

          # Step 1b: Enable cleaning_sequence if available
          - if: "{{ has_cleaning_sequence and is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'off') }}"
            then:
              - action: switch.turn_on
                continue_on_error: true
                target:
                  entity_id: "switch.{{ vacuum_base_name }}_cleaning_sequence"
              - wait_template: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
                timeout: 5
                continue_on_timeout: true

          # Step 2: Save & disable self_clean
          - variables:
              original_self_clean_state: "{{ states('switch.' ~ vacuum_base_name ~ '_self_clean') }}"
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "switch.{{ vacuum_base_name }}_self_clean"

          # Step 3: Set cleaning mode
          - action: select.select_option
            enabled: "{{ notification_target_mode | default('') != '' }}"
            continue_on_error: true
            target:
              entity_id: "{{ cleaning_mode_select }}"
            data:
              option: "{{ notification_target_mode }}"

          # Step 4: Mop washing (only for mop mode)
          - if: "{{ _is_mop }}"
            then:
              - action: button.press
                continue_on_error: true
                target:
                  entity_id: "button.{{ vacuum_base_name }}_self_clean"
              - wait_template: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') in ['washing', 'clean_add_water'] }}"
                timeout: "{{ mop_start_timeout }}"
                continue_on_timeout: false
              - wait_template: "{{ states('sensor.' ~ vacuum_base_name ~ '_self_wash_base_status') not in ['washing', 'clean_add_water'] }}"
                timeout: "{{ moistening_timeout }}"
                continue_on_timeout: true

          # Step 5: Extract segments & start cleaning
          - variables:
              notification_map_segments: >-
                {% set map_camera = 'camera.' ~ vacuum_base_name ~ '_map' %}
                {% if has_value(map_camera) %}
                  {% if state_attr(map_camera, 'rooms') is not none %}
                    {{ state_attr(map_camera, 'rooms').keys() | map('int') | list }}
                  {% elif state_attr(map_camera, 'segments') is not none %}
                    {{ state_attr(map_camera, 'segments').keys() | map('int') | list }}
                  {% else %}
                    []
                  {% endif %}
                {% else %}
                  []
                {% endif %}

          - if: "{{ use_segment_service and notification_map_segments | length > 0 }}"
            then:
              - action: dreame_vacuum.vacuum_clean_segment
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
                data:
                  segments: "{{ notification_map_segments }}"
                  repeats: "{{ notification_cleaning_repeats }}"
            else:
              - action: vacuum.start
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"

          # Step 6: Wait for cleaning state, delay, pause
          # Uses start_detect_states (cleaning_states without 'returning') so a robot
          # heading back to the dock is not mistaken for a started job, and continues
          # on timeout because the pause below is the safety action - see fn_start.
          - wait_template: "{{ states('sensor.' ~ vacuum_base_name ~ '_status') in start_detect_states }}"
            timeout: "{{ mop_start_timeout if _is_mop else sweep_start_timeout }}"
            continue_on_timeout: true
          - if: "{{ pause_delay_after_undock > 0 }}"
            then:
              - delay:
                  seconds: "{{ pause_delay_after_undock }}"
          - action: vacuum.pause
            continue_on_error: true
            target:
              entity_id: "{{ vacuum_entity }}"

          # Step 7: Discard temporary map if exists
          - if: "{{ auto_discard_temp_map and has_temporary_map }}"
            then:
              - action: dreame_vacuum.vacuum_discard_temporary_map
                continue_on_error: true
                target:
                  entity_id: "{{ vacuum_entity }}"
              - delay:
                  seconds: 2

          # [REMOVED] Step 8: Switch to target map - Now happens FIRST (before washing)
          # Map switch moved to beginning of sequence for correct map during washing/starting

          # Step 9: Re-disable customized_cleaning
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "switch.{{ vacuum_base_name }}_customized_cleaning"

          # Step 10: Re-set cleaning mode
          - action: select.select_option
            enabled: "{{ notification_target_mode | default('') != '' }}"
            continue_on_error: true
            target:
              entity_id: "{{ cleaning_mode_select }}"
            data:
              option: "{{ notification_target_mode }}"

          # Step 11: Restore self_clean
          - action: "switch.turn_{{ original_self_clean_state }}"
            continue_on_error: true
            target:
              entity_id: "switch.{{ vacuum_base_name }}_self_clean"

          # Step 12: Send pickup notification
          - if: "{{ notification_enabled }}"
            then:
              - variables:
                  map_name: "{{ notification_target_map_name }}"
                  current_map: "{{ states(selected_map_select) }}"
                  # NOTE: Notification service builder pattern (duplicated in scheduled_notify_services)
                  # REASON: Jinja2 in HA blueprints doesn't support macros/functions
                  # If modifying this logic, update scheduled_notify_services as well
                  pickup_notify_services: >
                    {% set result = [] %}
                    {% for person in notification_persons %}
                      {% if is_state(person, 'home') %}
                        {% set trackers = state_attr(person, 'device_trackers') %}
                        {% if trackers %}
                          {% set first_tracker = trackers if trackers is string_like else (trackers | first) %}
                          {% set tracker_name = first_tracker | replace('device_tracker.', '') %}
                          {% if tracker_name | length > 0 %}
                            {% set result = result + ['notify.mobile_app_' + tracker_name] %}
                          {% endif %}
                        {% endif %}
                      {% endif %}
                    {% endfor %}
                    {% for group in notification_groups %}
                      {% if group and group not in ['', 'unknown', 'unavailable', none] %}
                        {% set result = result + ['notify.' + group] %}
                      {% endif %}
                    {% endfor %}
                    {{ result }}
              - repeat:
                  for_each: "{{ pickup_notify_services }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        title: !input pickup_notification_title
                        message: !input pickup_notification_message
                        data:
                          actions:
                            - action: "START_CLEANING"
                              title: "{{ start_cleaning_button }}"
                            - action: "CANCEL_CLEANING"
                              title: "{{ cancel_cleaning_button }}"
                          push:
                            interruption-level: "{{ notification_interruption_level }}"
                            sound: >
                              {% if notification_critical %}
                                {{ {'name': notification_sound, 'critical': 1, 'volume': notification_volume} }}
                              {% else %}
                                {{ notification_sound }}
                              {% endif %}

          # Track new values for summary
          - variables:
              _new_map: "{{ states(selected_map_select) | default('unknown') }}"
              _new_mode: "{{ states(cleaning_mode_select) | default('unknown') }}"
              _new_customized: "{{ is_state('switch.' ~ vacuum_base_name ~ '_customized_cleaning', 'on') }}"
              _new_sequence: "{{ is_state('switch.' ~ vacuum_base_name ~ '_cleaning_sequence', 'on') }}"
              _new_self_clean: "{{ is_state('switch.' ~ vacuum_base_name ~ '_self_clean', 'on') }}"
              _map_changed: "{{ _old_map != _new_map }}"
              _mode_changed: "{{ _old_mode != _new_mode }}"
              _customized_changed: "{{ _old_customized != _new_customized }}"
              _sequence_changed: "{{ _old_sequence != _new_sequence }}"
              _self_clean_changed: "{{ _old_self_clean != _new_self_clean }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🔧 Prepare Complete"
                  notification_id: "vacuum_prepare_{{ _map_num }}_{{ 'mop' if _is_mop else 'sweep' }}"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ✔ **Map:** {% if _map_changed %}{{ _old_map }} → **{{ _new_map }}**{% else %}{{ _new_map }}{% endif %}
                    {% if has_customized_cleaning %}├─ ✔ **Customized:** {% if _customized_changed %}on → **off**{% else %}off{% endif %}
                    {% endif %}{% if has_cleaning_sequence %}├─ ✔ **Sequence:** {% if _sequence_changed %}off → **on**{% else %}on{% endif %}
                    {% endif %}├─ ✔ **Self-Clean:** {% if _self_clean_changed %}{{ 'on' if _old_self_clean else 'off' }} → **{{ 'on' if _new_self_clean else 'off' }}**{% else %}{{ 'on' if _new_self_clean else 'off' }}{% endif %}
                    ├─ ✔ **Cleaning-Mode:** {% if _mode_changed %}{{ _old_mode }} → **{{ _new_mode }}**{% else %}{{ _new_mode }}{% endif %}
                    {% if _is_mop %}├─ ✔ **Wash & Refill:** complete
                    {% endif %}├─ ✔ **Start:** {{ 'segments' if use_segment_service else 'vacuum.start' }}
                    ├─ ✔ **Pause:** paused
                    └─ ✔ **Notify:** {{ 'sent' if notification_enabled else 'disabled' }}

                    **Schedule:** {{ schedule_label }}
                    **Duration:** {{ ((now().timestamp() - _fn_start) | round(1)) }}s

      # ========================================
      # NOTIFICATION ACTION: Skip Cleaning
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'notification_skip' }}"
        sequence:
          # Skip this scheduled cleaning - no action needed
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "⏭️ Skipped"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    └─ ✔ **Skip:** user action

      # ========================================
      # EMERGENCY WATCH: Unexpected Cleaning Start
      # ========================================
      # Validates map selection when cleaning starts outside our workflow
      # Pauses robot if selected map is not one of our configured maps
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'emergency_watch' }}"
        sequence:
          # Safety check: Validate selected map
          - if:
              - condition: template
                value_template: "{{ states(selected_map_select) not in [map_1_name, map_2_name, map_3_name, map_4_name] }}"
            then:
              # Invalid map → Emergency pause (always show)
              - action: vacuum.pause
                target:
                  entity_id: "{{ vacuum_entity }}"

              - action: persistent_notification.create
                data:
                  title: "⚠️ Emergency Pause"
                  notification_id: "vacuum_emergency_pause"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Map:** {{ states(selected_map_select) }}
                    └─ ✔ **Pause:** emergency

                    ❌ Automation aborted
                    **Valid:** {{ map_1_name }}, {{ map_2_name }}, {{ map_3_name }}, {{ map_4_name }}

              - stop: "Emergency pause - invalid map selected"
                error: true

          # Map is valid → Continue (external start on valid map)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "▶️ External Start"
                  notification_id: "vacuum_external_start"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    └─ ✔ **Map:** {{ states(selected_map_select) }}

      # ========================================
      # NOTIFICATION ACTION: Start Cleaning
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'notification_start' }}"
        sequence:
          # Verification: Check if robot is still paused
          - if: "{{ states('sensor.' ~ vacuum_base_name ~ '_status') != 'paused' }}"
            then:
              # Error notifications always show
              - action: persistent_notification.create
                data:
                  title: "⚠️ Resume Failed"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ⚠️ **Status:** {{ states('sensor.' ~ vacuum_base_name ~ '_status') }}
                    └─ ○ Resume

                    ❌ Automation aborted
                  notification_id: "start_not_paused_{{ vacuum_base_name }}"
              - stop: "Robot not in paused state"
                error: true

          # Resume cleaning after transport
          - action: vacuum.start
            target:
              entity_id: "{{ vacuum_entity }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "▶️ Resume Complete"
                  notification_id: "vacuum_resume_{{ vacuum_base_name }}"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    └─ ✔ **Resume:** {{ states(selected_map_select) }}

      # ========================================
      # NOTIFICATION ACTION: Cancel Cleaning
      # ========================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'notification_cancel' }}"
        sequence:
          # Check if robot is on base station map
          - choose:
              # If NOT on base station map, switch to it
              - conditions:
                  - condition: template
                    value_template: "{{ current_map_name != base_station_map }}"
                sequence:
                  # Discard temporary map if exists and auto-discard enabled
                  - if: "{{ auto_discard_temp_map and has_temporary_map }}"
                    then:
                      - action: dreame_vacuum.vacuum_discard_temporary_map
                        continue_on_error: true
                        target:
                          entity_id: "{{ vacuum_entity }}"
                      - delay:
                          seconds: 2

                  - action: select.select_option
                    continue_on_error: true # Don't abort if select entity unavailable
                    target:
                      entity_id: "{{ selected_map_select }}"
                    data:
                      option: "{{ base_station_map }}"

                  - wait_template: "{{ states(selected_map_select) == base_station_map }}"
                    timeout: 30
                    continue_on_timeout: true

          # Return to dock
          - action: vacuum.return_to_base
            target:
              entity_id: "{{ vacuum_entity }}"

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🏠 Cancel Complete"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    ├─ ✔ **Map:** {{ base_station_map }}
                    └─ ✔ **Return:** to base

      # ============================================================================
      # Auto-Switch-Back to Base Map (after room cleaning completion)
      # ============================================================================
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'auto_switch_to_base' }}"
        sequence:
          # Feature flag check
          - if:
              - condition: template
                value_template: "{{ not auto_switch_to_base_enabled }}"
            then:
              - stop: "Auto-switch to base map disabled"

          # Check: Current map is NOT base station map
          - if:
              - condition: template
                value_template: "{{ current_map_name == base_station_map }}"
            then:
              - stop: "Already on base station map, no switch needed"

          # Check: NOT during washing/drying operation
          - if:
              - condition: template
                value_template: >
                  {% set wash_status = states(self_wash_base_status_sensor) %}
                  {{ wash_status in ['washing', 'drying'] }}
            then:
              - stop: "Washing/drying in progress, skip auto-switch"

          # Check: NO active schedule preparation workflow
          - if:
              - condition: template
                value_template: "{{ preparation_active }}"
            then:
              - stop: "Schedule preparation active, skip auto-switch"

          # Check: 20-second safety buffer since last pause
          - if:
              - condition: template
                value_template: "{{ time_since_pause < 20 }}"
            then:
              - stop: "Recent pause detected ({{ time_since_pause }}s ago), safety buffer active"

          # Track old map for summary
          - variables:
              _old_map: "{{ current_map_name }}"

          # Switch to base station map
          - action: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ selected_map_select }}"
            data:
              option: "{{ base_station_map }}"

          # Verify switch completed
          - wait_template: "{{ states(selected_map_select) == base_station_map }}"
            timeout: 30
            continue_on_timeout: true

          # Summary notification (Level 1+)
          - if: "{{ debug_info }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "🏠 Auto-Switch Complete"
                  message: |
                    {{ now().strftime('%H:%M:%S') }}

                    └─ ✔ **Map:** {{ _old_map }} → **{{ base_station_map }}**

    # Default: Unknown trigger ID (should not happen)
    default:
      - if: "{{ debug_info }}"
        then:
          - action: persistent_notification.create
            data:
              title: "⚠️ Unknown Trigger"
              message: |
                {{ now().strftime('%H:%M:%S') }}

                ├─ ⚠️ **Function:** {{ triggered_function }}
                └─ ⚠️ **Platform:** {{ trigger.platform }}

# ========================================
# AUTOMATION MODE
# ========================================
mode: queued
max: 10
max_exceeded: silent